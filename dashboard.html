<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribity</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
        }

        button {
            min-inline-size: 1.75rem;
            min-block-size: 1.75rem;
        }

        /* Card actions stay legible even when the icon CDN is unavailable. */
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .card-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-height: 32px;
            min-width: 32px;
            padding: 4px 9px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            background: #334155;
            color: #f8fafc;
            font-size: 12px;
            font-weight: 600;
            line-height: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        .card-action:hover { background: #475569; }
        .card-action[aria-pressed="true"] {
            background: #78350f;
            border-color: #fbbf24;
            color: #fef3c7;
        }
        .card-action:disabled {
            background: #1e293b;
            color: #cbd5e1;
            border-color: #64748b;
            border-style: dashed;
            cursor: not-allowed;
            opacity: 1;
        }

        .rule-remove-button {
            position: absolute;
            top: 12px;
            right: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid #b91c1c;
            border-radius: 6px;
            background: #450a0a;
            color: #fca5a5;
            cursor: pointer;
        }

        .rule-remove-button:hover { background: #7f1d1d; color: #fff; }

        .custom-input {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 0.5rem;
            border-radius: 0.25rem;
            width: 100%;
            font-size: 0.875rem;
        }

        .custom-input:focus {
            border-color: #60a5fa;
            outline: 2px solid #60a5fa;
            outline-offset: 2px;
            box-shadow: 0 0 0 1px #60a5fa;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [role="separator"]:focus-visible {
            outline: 2px solid #60a5fa !important;
            outline-offset: 2px !important;
        }

        .group:focus-within .reveal-action {
            opacity: 1;
        }

        .library-delete {
            flex-shrink: 0;
            width: max-content;
            max-width: 100%;
            min-inline-size: 0;
            white-space: nowrap;
        }

        .library-delete > span {
            flex-shrink: 0;
        }

        @media (hover: none), (pointer: coarse) {
            .reveal-action {
                opacity: 1 !important;
            }
        }

        .custom-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: #6366f1;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle-switch.active::after {
            transform: translateX(16px);
        }

        /* Floating example button */
        .float-example-btn {
            position: absolute;
            background: #6366f1;
            color: white;
            border: 1px solid #818cf8;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: background 0.15s;
            pointer-events: auto;
        }

        .float-example-btn:hover {
            background: #4f46e5;
        }

        /* E009: Error toast pulse */
        @keyframes errorPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.3);
            }
        }

        /* E016: Delete toast slide-in */
        @keyframes slideIn {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Example card */
        .example-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-left: 3px solid #f59e0b;
            border-radius: 6px;
            padding: 12px;
            position: relative;
        }

        .example-card:hover {
            border-color: #475569;
            border-left-color: #f59e0b;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

<body>
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback } = React;

        // These essential controls use local SVGs, independent of the icon CDN.
        const CardActionIcon = ({ name }) => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                aria-hidden="true" focusable="false">
                {name === 'edit' && <path d="M16 3a2.12 2.12 0 0 1 3 3L7 18l-4 1 1-4L16 3ZM14 5l3 3" />}
                {name === 'support' && <g>
                    <path d="M8 12h8M2 10v4M22 10v4" />
                    <rect x="4" y="6" width="4" height="12" rx="1" />
                    <rect x="16" y="6" width="4" height="12" rx="1" />
                </g>}
                {name === 'up' && <path d="M12 19V5M5 12l7-7 7 7" />}
                {name === 'down' && <path d="M12 5v14M5 12l7 7 7-7" />}
            </svg>
        );

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const svgHtml = useMemo(() => {
                if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    return window.lucide.icons[name].toSvg({ "class": className, "width": size, "height": size, "stroke-width": 2 });
                }
                return null;
            }, [name, size, className]);
            return svgHtml ? <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="inline-flex items-center justify-center" /> : null;
        };

        // Keep the normal label size unless the card itself cannot contain it.
        const LibraryDeleteButton = ({ onClick }) => {
            const buttonRef = useRef(null);
            const labelRef = useRef(null);

            useLayoutEffect(() => {
                const button = buttonRef.current;
                const label = labelRef.current;
                const footer = button.parentElement;
                const fit = () => {
                    label.style.fontSize = '';
                    const style = getComputedStyle(button);
                    const naturalWidth = label.getBoundingClientRect().width;
                    const icon = button.querySelector('svg');
                    const iconSpace = icon ? icon.parentElement.getBoundingClientRect().width + parseFloat(style.columnGap) : 0;
                    const available = button.getBoundingClientRect().width
                        - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
                        - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth) - iconSpace;
                    if (naturalWidth > available && available > 0) {
                        // Measure the actual glyphs: font hinting is not perfectly
                        // proportional, so a width ratio can still leave overflow.
                        let low = 0;
                        let high = parseFloat(style.fontSize);
                        for (let step = 0; step < 12; step++) {
                            const size = (low + high) / 2;
                            label.style.fontSize = `${size}px`;
                            if (label.getBoundingClientRect().width <= available) low = size;
                            else high = size;
                        }
                        label.style.fontSize = `${low}px`;
                    }
                };
                let previousWidth;
                const observer = new ResizeObserver(([entry]) => {
                    if (entry.contentRect.width === previousWidth) return;
                    previousWidth = entry.contentRect.width;
                    fit();
                });
                observer.observe(footer);
                window.addEventListener('resize', fit);
                document.fonts.addEventListener('loadingdone', fit);
                fit();
                return () => {
                    observer.disconnect();
                    window.removeEventListener('resize', fit);
                    document.fonts.removeEventListener('loadingdone', fit);
                };
            }, []);

            return (
                <button ref={buttonRef} type="button" onClick={onClick}
                    className="library-delete reveal-action opacity-0 group-hover:opacity-100 bg-red-900/50 border border-red-700 text-red-400 hover:bg-red-800 px-2 py-1 rounded text-xs font-bold flex items-center gap-1 transition-opacity">
                    <Icon name="trash-2" size={10} />
                    <span ref={labelRef}>DELETE</span>
                </button>
            );
        };

        const MODAL_FOCUSABLE_SELECTOR = [
            'button:not([disabled])',
            '[href]',
            'input:not([disabled])',
            'select:not([disabled])',
            'textarea:not([disabled])',
            '[tabindex]:not([tabindex="-1"])',
        ].join(',');

        const AccessibleModal = ({
            open,
            onClose,
            labelledBy,
            describedBy,
            returnFocusRef,
            overlayClassName = 'z-[110] bg-black/60 backdrop-blur-sm px-4',
            panelClassName,
            children,
        }) => {
            const dialogRef = useRef(null);
            const previousFocusRef = useRef(null);
            const onCloseRef = useRef(onClose);
            onCloseRef.current = onClose;

            useEffect(() => {
                if (!open) return undefined;

                previousFocusRef.current = returnFocusRef?.current || document.activeElement;
                const dialog = dialogRef.current;
                const focusableElements = () => Array.from(dialog?.querySelectorAll(MODAL_FOCUSABLE_SELECTOR) || [])
                    .filter(element => element.getClientRects().length > 0);
                const initialFocus = dialog?.querySelector('[data-modal-initial-focus]') || focusableElements()[0] || dialog;
                initialFocus?.focus();

                const handleKeyDown = (event) => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        onCloseRef.current();
                        return;
                    }
                    if (event.key !== 'Tab') return;

                    const elements = focusableElements();
                    if (elements.length === 0) {
                        event.preventDefault();
                        dialog?.focus();
                        return;
                    }

                    const first = elements[0];
                    const last = elements[elements.length - 1];
                    if (event.shiftKey && (document.activeElement === first || !dialog?.contains(document.activeElement))) {
                        event.preventDefault();
                        last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                        event.preventDefault();
                        first.focus();
                    }
                };

                document.addEventListener('keydown', handleKeyDown);
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    const returnTarget = returnFocusRef?.current || previousFocusRef.current;
                    requestAnimationFrame(() => {
                        if (returnTarget?.isConnected) returnTarget.focus();
                    });
                };
            }, [open, returnFocusRef]);

            if (!open) return null;

            // Portal to the document body: blurred/transformed toolbars must
            // never become the containing block for a viewport-sized dialog.
            return ReactDOM.createPortal(
                <div
                    className={`fixed inset-0 flex items-center justify-center ${overlayClassName}`}
                    style={{ position: 'fixed', inset: 0, padding: '1rem', boxSizing: 'border-box', overflowY: 'auto' }}
                    onMouseDown={(event) => {
                        if (event.target === event.currentTarget) onClose();
                    }}
                >
                    <div
                        ref={dialogRef}
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby={labelledBy}
                        aria-describedby={describedBy}
                        tabIndex="-1"
                        className={panelClassName}
                        style={{ maxHeight: 'calc(100dvh - 2rem)', minHeight: 0, overflowY: 'auto' }}
                        onMouseDown={(event) => event.stopPropagation()}
                    >
                        {children}
                    </div>
                </div>,
                document.body
            );
        };

        // --- UTILITY: auto-resize textarea to content height ---
        const autoResizeTextarea = (e) => {
            e.target.style.height = 'auto';
            e.target.style.height = e.target.scrollHeight + 'px';
        };

        // Use the same host and port that served the dashboard.
        const api = (path, options) => fetch(`/api/${path}`, options);

        // --- SCHEMAS ---
        const ITEM_TEMPLATE = {
            "id_item": "", "id_source": "", "id_script": 0, "id_subpart": [],
            "rule_name": [], "rule_number": [], "subpart_name": [], "subpart_number": [],
            "quote_original": "", "quote_translation": "", "quoted_speaker_name": "", "language": "",
            "contains_example": false, "contains_only_example": false,
            "example": "", "example_02": "", "example_03": "",
            "example_note": "", "example_02_note": "", "example_03_note": "",
            "short_cite": "", "url": "", "script_part": "",
            "nested_under": "",
            "edit_tags": "", "relevance_tags": [], "needs_verification": false,
            "script_notes": "", "script_tags": "", "audio_tags": "",
            "id_extra_01": "", "id_extra_02": "",
            "event_date_yyyy-mm-dd": "", "event_time": "",
            "latitude": "", "longitude": "", "location_name": "",
            "user_01_comments": "", "user_02_comments": ""
        };

        // --- CONDITIONAL SCHEMA HELPERS ---
        // Detect research schema (uses category_part_name) vs improv schema (uses rule_name)
        const detectSchemaMode = (items) => {
            if (!items || items.length === 0) return 'improv';
            // Check first non-empty item
            for (const item of items) {
                if (item.hasOwnProperty('category_part_name')) return 'research';
                if (item.hasOwnProperty('rule_name')) return 'improv';
            }
            return 'improv';
        };

        const ensureUniqueItemIds = (items) => {
            const seenIds = new Set();
            return items.map(item => {
                const existingId = typeof item?.id_item === 'string' ? item.id_item : '';
                if (existingId.trim() && !seenIds.has(existingId)) {
                    seenIds.add(existingId);
                    return item;
                }

                const newId = crypto.randomUUID();
                seenIds.add(newId);
                return { ...item, id_item: newId };
            });
        };

        // Normalize: ensure stable identities, then remap research fields → internal fields on load.
        const normalizeItems = (items, mode) => {
            const identifiedItems = ensureUniqueItemIds(items);
            if (mode !== 'research') return identifiedItems;
            return identifiedItems.map(item => {
                const { category_part_name, category_part_number, ...rest } = item;
                return {
                    ...rest,
                    rule_name: category_part_name || [],
                    rule_number: category_part_number || [],
                };
            });
        };

        // Denormalize: remap internal (rule_name) → research field names on save
        const denormalizeItems = (items, mode) => {
            if (mode !== 'research') return items;
            return items.map(item => {
                const { rule_name, rule_number, ...rest } = item;
                return {
                    ...rest,
                    category_part_name: rule_name || [],
                    category_part_number: rule_number || [],
                };
            });
        };

        // UI labels keyed by schema mode
        const SCHEMA_LABELS = {
            improv: {
                rule: 'Rule', rules: 'Rules', addRule: 'Add Another Rule', newRule: 'New Rule',
                selectRule: 'Select Rule', assignRule: 'Assign Rule', selectARule: 'Select a Rule',
                ruleInSidebar: 'rule', appTitle: 'SCRIBITY (book mode)',
                user_01: 'Comments', user_02: 'Writing Notes',
                examplesTitle: 'Examples', exampleSlot: 'Ex', exampleAdd: '+ Example',
                exampleEmpty: 'Highlight text in the quote above, then click',
                exampleNoteHint: 'Add a note...',
            },
            research: {
                rule: 'Category', rules: 'Categories', addRule: 'Add Another Category', newRule: 'New Category',
                selectRule: 'Select Category', assignRule: 'Assign Category', selectARule: 'Select a Category',
                ruleInSidebar: 'category', appTitle: 'SCRIBITY (show mode)',
                user_01: 'DRR Report Text', user_02: 'Writing Notes',
                examplesTitle: 'Storyboard', exampleSlot: 'Clip', exampleAdd: '+ Clip',
                exampleEmpty: 'Highlight text in the quote above, then click',
                exampleNoteHint: 'Add a note to this clip...',
            },
        };

        const SOURCE_TEMPLATE = {
            "id_source": "", "short_cite": "",
            "author": "", "title": "", "publication": "", "additional_source_details": "",
            "date_published": "", "date_accessed": "", "url": "", "archive_url": "", "page": "", "timestamp": "",
            "source_within_source_short_cite": "", "source_within_source_full_link": "",
            "related_reading": "", "to_do": "",
            "user_01_comments": "", "user_02_comments": ""
        };

        const TEXTAREA_FIELDS = ['quote_original', 'quote_translation', 'example', 'example_02', 'example_03', 'example_note', 'example_02_note', 'example_03_note', 'additional_source_details', 'script_notes', 'to_do', 'related_reading', 'user_01_comments', 'user_02_comments'];

        const EXAMPLE_FIELDS = ['example', 'example_02', 'example_03'];
        const EXAMPLE_NOTE_FIELDS = ['example_note', 'example_02_note', 'example_03_note'];
        const EXAMPLE_EXCLUDED_KEYS = ['contains_example', 'contains_only_example', 'example', 'example_02', 'example_03', 'example_note', 'example_02_note', 'example_03_note'];

        // Fields that go into the collapsible "Additional Information" section
        const ADDITIONAL_INFO_FIELDS = ['short_cite', 'url', 'id_script', 'id_subpart', 'id_extra_01', 'id_extra_02', 'script_part', 'quoted_speaker_name', 'user_01_comments', 'user_02_comments', 'edit_tags', 'script_notes', 'script_tags', 'audio_tags', 'needs_verification', 'language', 'quote_translation', 'event_date_yyyy-mm-dd', 'event_time', 'latitude', 'longitude', 'location_name'];

        // Fields rendered by other UI sections (Primary Quote, Linked Source, RuleManager, ExampleManager)
        const RENDERED_ELSEWHERE = new Set([
            'id_item', 'id_source', 'quote_original', 'report_provenance',
            'rule_name', 'rule_number', 'subpart_name', 'subpart_number',
            'relevance_tags',
            ...EXAMPLE_EXCLUDED_KEYS,
            ...ADDITIONAL_INFO_FIELDS
        ]);

        const SourcePicker = ({ sources, selectedId, onSelect }) => {
            const [query, setQuery] = useState('');
            const [open, setOpen] = useState(false);
            const [activeId, setActiveId] = useState(null);
            const listRef = useRef(null);
            const sourceLabel = source => source ? (source.short_cite || source.title || source.id_source) : '';
            const currentSource = sources.find(source => source.id_source === selectedId);
            const filtered = sources.filter(source =>
                (source.short_cite || '').toLowerCase().includes(query.toLowerCase()) ||
                (source.title || '').toLowerCase().includes(query.toLowerCase())
            );
            const activeIndex = filtered.findIndex(source => source.id_source === activeId);
            const close = () => { setOpen(false); setQuery(''); setActiveId(null); };
            const select = source => { onSelect(source.id_source); close(); };

            // Undo or another document edit must not leave an old suggestion active.
            useEffect(() => { close(); }, [selectedId]);
            useEffect(() => {
                if (open && activeIndex >= 0) {
                    listRef.current?.children[activeIndex]?.scrollIntoView({ block: 'nearest' });
                }
            }, [open, activeIndex]);

            const handleKeyDown = event => {
                if (event.isComposing || event.keyCode === 229 || event.ctrlKey || event.metaKey || event.altKey) return;
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    event.stopPropagation();
                    setOpen(true);
                    if (!filtered.length) return;
                    const next = activeIndex < 0
                        ? (event.key === 'ArrowDown' ? 0 : filtered.length - 1)
                        : Math.max(0, Math.min(filtered.length - 1, activeIndex + (event.key === 'ArrowDown' ? 1 : -1)));
                    setActiveId(filtered[next].id_source);
                } else if (event.key === 'Enter' && open && activeIndex >= 0) {
                    event.preventDefault();
                    event.stopPropagation();
                    select(filtered[activeIndex]);
                } else if (event.key === 'Escape' && open) {
                    event.preventDefault();
                    event.stopPropagation();
                    close();
                } else if (event.key === 'Tab') {
                    close();
                }
            };

            return (
                <div className="flex items-center gap-2">
                    <label htmlFor="source-connect-search" className="text-xs text-slate-400 uppercase font-bold shrink-0">Connect source:</label>
                    <div className="relative flex items-center gap-1">
                        <input
                            id="source-connect-search"
                            type="text" role="combobox" autoComplete="off"
                            aria-autocomplete="list" aria-haspopup="listbox" aria-expanded={open}
                            aria-controls={open ? 'source-connect-options' : undefined}
                            aria-activedescendant={open && activeIndex >= 0 ? `source-connect-option-${activeIndex}` : undefined}
                            aria-describedby="source-connect-help"
                            className="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 w-[240px] focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500 outline-none"
                            placeholder="Search sources"
                            value={open ? query : sourceLabel(currentSource)}
                            onFocus={() => { setOpen(true); setQuery(''); setActiveId(null); }}
                            onClick={() => { if (!open) { setOpen(true); setQuery(''); setActiveId(null); } }}
                            onChange={event => { setQuery(event.target.value); setActiveId(null); setOpen(true); }}
                            onKeyDown={handleKeyDown}
                            onBlur={close}
                        />
                        <span id="source-connect-help" className="sr-only">Type to search. Use Up and Down arrows to choose a result, Enter to connect, or Escape to cancel.</span>
                        {selectedId && (
                            <button type="button" onClick={() => { onSelect(''); close(); }} aria-label="Unlink source"
                                className="p-1 text-slate-400 hover:text-red-400 focus-visible:ring-2 focus-visible:ring-emerald-500 rounded transition-colors"
                                title="Unlink source">
                                <Icon name="x" size={12} />
                            </button>
                        )}
                        {open && (
                            <div className="absolute left-0 top-full mt-1 z-50 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl shadow-black/50 w-[320px]">
                                <div ref={listRef} id="source-connect-options" role="listbox" aria-label="Sources"
                                    className="max-h-[240px] overflow-y-auto">
                                    {filtered.map((source, index) => (
                                        <button type="button" role="option" tabIndex={-1} key={source.id_source}
                                            id={`source-connect-option-${index}`} aria-selected={index === activeIndex}
                                            // Keep DOM focus in the combobox; click handles all selection activation.
                                            onMouseDown={event => event.preventDefault()}
                                            onClick={() => select(source)}
                                            className={`w-full text-left px-3 py-2 text-xs hover:bg-emerald-800 transition-colors flex items-center gap-2 ${index === activeIndex ? 'bg-emerald-800 text-white outline outline-2 -outline-offset-2 outline-emerald-400' : 'text-slate-200'}`}>
                                            <Icon name="database" size={10} className="text-emerald-400 shrink-0" />
                                            <span className="truncate">{sourceLabel(source)}</span>
                                        </button>
                                    ))}
                                </div>
                                <div role="status" aria-live="polite" aria-atomic="true"
                                    className={filtered.length ? 'sr-only' : 'px-3 py-2 text-xs text-slate-300'}>
                                    {filtered.length ? `${filtered.length} sources available.` : 'No sources match your search.'}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- RULE EDITOR COMPONENTS ---

        const RuleRow = ({ index, ruleData, allRules, allItems, labels, onDelete, onChange }) => {
            const [isNewRule, setIsNewRule] = useState(false);
            const [isNewSubpart, setIsNewSubpart] = useState(false);

            const currentRuleName = ruleData.name || "";
            const currentSubpartName = ruleData.subpartName || "";

            // Get known subparts for this rule — derived directly from items data
            const knownSubparts = useMemo(() => {
                if (!currentRuleName) return [];
                const subpartSet = new Set();
                (allItems || []).forEach(item => {
                    const rNames = Array.isArray(item.rule_name) ? item.rule_name : [];
                    const sNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];
                    rNames.forEach((rn, i) => {
                        if (rn === currentRuleName && i < sNames.length && sNames[i]) {
                            subpartSet.add(sNames[i]);
                        }
                    });
                });
                return Array.from(subpartSet).sort((a, b) =>
                    a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
                );
            }, [currentRuleName, allItems]);

            return (
                <div className="bg-slate-950/50 p-3 pr-14 rounded border border-slate-800 flex flex-col gap-2 relative">
                    {index > 0 && <button
                        type="button"
                        aria-label={`Delete ${labels.rule.toLowerCase()} row ${index + 1}`}
                        title={`Remove this ${labels.rule.toLowerCase()} assignment`}
                        onClick={() => onDelete(index)}
                        className="rule-remove-button"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                            aria-hidden="true" focusable="false">
                            <path d="M3 6h18M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14M10 10v7M14 10v7" />
                        </svg>
                    </button>}

                    <div className="flex gap-2 items-start">
                        {/* Rule Name */}
                        <div className="flex-1">
                            <label htmlFor={`rule-row-${index}-name`} className="text-xs uppercase text-slate-500 font-bold mb-1 block">{labels.rule}</label>
                            {isNewRule ? (
                                <input
                                    id={`rule-row-${index}-name`}
                                    className="custom-input text-xs"
                                    placeholder={`New ${labels.rule} Name`}
                                    value={currentRuleName}
                                    autoFocus
                                    onChange={(e) => onChange(index, 'name', e.target.value)}
                                    onBlur={() => { if (!currentRuleName) setIsNewRule(false); }}
                                />
                            ) : (
                                <select
                                    id={`rule-row-${index}-name`}
                                    className="custom-input text-xs"
                                    value={currentRuleName}
                                    onChange={(e) => {
                                        if (e.target.value === '__NEW__') setIsNewRule(true);
                                        else onChange(index, 'name', e.target.value);
                                    }}
                                >
                                    <option value="">-- {labels.selectRule} --</option>
                                    {allRules.map(r => <option key={r.name} value={r.name}>{r.name}</option>)}
                                    <option value="__NEW__" className="text-amber-400 font-bold">+ {labels.newRule}</option>
                                </select>
                            )}
                        </div>

                        {/* Rule Number */}
                        <div className="w-20">
                            <label htmlFor={`rule-row-${index}-number`} className="text-xs uppercase text-slate-500 font-bold mb-1 block">#</label>
                            <input
                                id={`rule-row-${index}-number`}
                                className="custom-input text-xs font-mono text-amber-500"
                                value={ruleData.number || ""}
                                placeholder="#"
                                onChange={(e) => onChange(index, 'number', e.target.value)}
                            />
                        </div>
                    </div>

                    {/* Subpart Row */}
                    <div className="flex gap-2 items-start pl-4 border-l-2 border-slate-800">
                        {/* Subpart Name */}
                        <div className="flex-1">
                            <label htmlFor={`rule-row-${index}-subpart`} className="text-xs uppercase text-slate-500 font-bold mb-1 block">Subpart</label>
                            {isNewSubpart ? (
                                <input
                                    id={`rule-row-${index}-subpart`}
                                    className="custom-input text-xs"
                                    placeholder="New Subpart Name"
                                    value={currentSubpartName}
                                    autoFocus
                                    onChange={(e) => onChange(index, 'subpartName', e.target.value)}
                                    onBlur={() => { if (!currentSubpartName) setIsNewSubpart(false); }}
                                />
                            ) : (
                                <select
                                    id={`rule-row-${index}-subpart`}
                                    className="custom-input text-xs"
                                    value={currentSubpartName}
                                    disabled={!currentRuleName}
                                    onChange={(e) => {
                                        if (e.target.value === '__NEW__') setIsNewSubpart(true);
                                        else onChange(index, 'subpartName', e.target.value);
                                    }}
                                >
                                    <option value="">-- {currentRuleName ? 'Select Subpart' : `Select ${labels.rule} First`} --</option>
                                    {knownSubparts.map(s => <option key={s} value={s}>{s}</option>)}
                                    <option value="__NEW__" className="text-amber-400 font-bold">+ New Subpart</option>
                                </select>
                            )}
                        </div>

                        {/* Subpart Number */}
                        <div className="w-20">
                            <label htmlFor={`rule-row-${index}-subpart-number`} className="text-xs uppercase text-slate-500 font-bold mb-1 block">Sub #</label>
                            <input
                                id={`rule-row-${index}-subpart-number`}
                                className="custom-input text-xs font-mono text-amber-500/70"
                                value={ruleData.subpartNumber || ""}
                                placeholder="#"
                                onChange={(e) => onChange(index, 'subpartNumber', e.target.value)}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const RuleManager = ({ item, ruleHierarchy, allItems, labels, onSave }) => {
            // Structure item data into rows for easier editing
            const rows = useMemo(() => {
                const rNames = Array.isArray(item.rule_name) ? item.rule_name : [];
                const rNums = Array.isArray(item.rule_number) ? item.rule_number : [];
                const sNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];
                const sNums = Array.isArray(item.subpart_number) ? item.subpart_number : [];
                const sOrder = Array.isArray(item.id_subpart) ? item.id_subpart : [];

                const maxLen = Math.max(rNames.length, 1); // Always at least 1 row
                const res = [];
                for (let i = 0; i < maxLen; i++) {
                    res.push({
                        name: rNames[i] || "",
                        number: rNums[i] || "",
                        subpartName: sNames[i] || "",
                        subpartNumber: sNums[i] || "",
                        idSubpart: sOrder[i] || 0
                    });
                }
                return res;
            }, [item]);

            const handleChange = (idx, field, value) => {
                const newRows = [...rows];
                newRows[idx] = { ...newRows[idx], [field]: value };
                saveRowData(newRows);
            };

            const handleDelete = (idx) => {
                // The first assignment is required; only additional rows can be removed.
                if (!Number.isInteger(idx) || idx <= 0 || idx >= rows.length) return;
                const newRows = rows.filter((_, i) => i !== idx);
                saveRowData(newRows);
            };

            const handleAdd = () => {
                const newRows = [...rows, { name: "", number: "", subpartName: "", subpartNumber: "", idSubpart: 0 }];
                saveRowData(newRows);
            };

            const saveRowData = (newRows) => {
                // Deconstruct back to parallel arrays
                const newItem = {
                    ...item,
                    rule_name: newRows.map(r => r.name),
                    rule_number: newRows.map(r => r.number),
                    subpart_name: newRows.map(r => r.subpartName),
                    subpart_number: newRows.map(r => r.subpartNumber),
                    id_subpart: newRows.map(r => r.idSubpart || 0)
                };
                onSave(newItem);
            };

            return (
                <div className="col-span-12 bg-slate-900 border border-slate-800 p-4 rounded-lg">
                    <div className="flex justify-between items-center mb-3">
                        <span className="custom-label text-indigo-400 mb-0">Applied {labels.rules}</span>
                        <button onClick={handleAdd} className="text-xs bg-indigo-900/50 hover:bg-indigo-800 text-indigo-300 px-2 py-1 rounded font-bold border border-indigo-700/50 flex items-center gap-1">
                            <Icon name="plus" size={12} /> {labels.addRule}
                        </button>
                    </div>
                    <div className="space-y-3">
                        {rows.map((row, idx) => (
                            <RuleRow
                                key={idx}
                                index={idx}
                                ruleData={row}
                                allRules={ruleHierarchy}
                                allItems={allItems}
                                labels={labels}
                                onDelete={handleDelete}
                                onChange={handleChange}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        // --- EXAMPLE MANAGER COMPONENT ---

        const ExampleManager = ({ item, labels, onSave, onLocalChange, noteSaveTimer }) => {
            const examples = EXAMPLE_FIELDS.map((f, i) => ({
                key: f,
                noteKey: EXAMPLE_NOTE_FIELDS[i],
                text: item[f] || '',
                note: item[EXAMPLE_NOTE_FIELDS[i]] || '',
            }));
            const filledCount = examples.filter(e => e.text).length;
            const hasExampleFlag = item.contains_example;
            const [editingIdx, setEditingIdx] = useState(null);
            const [editingNoteIdx, setEditingNoteIdx] = useState(null);

            const handleDelete = (idx) => {
                const texts = examples.map(e => e.text);
                const notes = examples.map(e => e.note);
                // Remove at idx and compact both arrays together
                texts.splice(idx, 1);
                notes.splice(idx, 1);
                while (texts.length < 3) { texts.push(''); notes.push(''); }

                const newItem = {
                    ...item,
                    example: texts[0], example_02: texts[1], example_03: texts[2],
                    example_note: notes[0], example_02_note: notes[1], example_03_note: notes[2],
                    contains_example: texts.some(t => t)
                };
                onSave(newItem);
                setEditingIdx(null);
                setEditingNoteIdx(null);
            };

            const handleEdit = (idx, newText) => {
                const fieldKey = EXAMPLE_FIELDS[idx];
                const newItem = {
                    ...item,
                    [fieldKey]: newText,
                    contains_example: newText || examples.some((e, i) => i !== idx && e.text)
                };
                onSave(newItem);
            };

            const handleNoteEdit = (idx, newNote) => {
                const noteKey = EXAMPLE_NOTE_FIELDS[idx];
                const newItem = { ...item, [noteKey]: newNote };
                onLocalChange(newItem, noteSaveTimer);
            };

            return (
                <div className="col-span-12 bg-slate-900 border border-slate-800 p-4 rounded-lg">
                    <div className="flex justify-between items-center mb-3">
                        <span className="custom-label text-amber-400 mb-0 flex items-center gap-2">
                            <Icon name="lightbulb" size={14} className="text-amber-400" />
                            {labels.examplesTitle || 'Examples'}
                            {filledCount > 0 && (
                                <span className="text-xs bg-amber-900/30 text-amber-400 px-1.5 py-0.5 rounded font-mono">
                                    {filledCount} of 3
                                </span>
                            )}
                        </span>
                        <div className="flex items-center gap-4">
                            <label htmlFor="contains-only-example" className="flex items-center gap-2 cursor-pointer">
                                <span className="text-xs uppercase text-slate-500 font-bold">Only Example</span>
                                <input
                                    id="contains-only-example"
                                    type="checkbox"
                                    className="sr-only peer"
                                    checked={Boolean(item.contains_only_example)}
                                    onChange={(e) => onSave({ ...item, contains_only_example: e.target.checked })}
                                />
                                <span
                                    aria-hidden="true"
                                    className={`toggle-switch peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900 ${item.contains_only_example ? 'active' : ''}`}
                                />
                            </label>
                            <label htmlFor="contains-example" className="flex items-center gap-2 cursor-pointer">
                                <span className="text-xs uppercase text-slate-500 font-bold">Has Example</span>
                                <input
                                    id="contains-example"
                                    type="checkbox"
                                    className="sr-only peer"
                                    checked={Boolean(item.contains_example)}
                                    onChange={(e) => onSave({ ...item, contains_example: e.target.checked })}
                                />
                                <span
                                    aria-hidden="true"
                                    className={`toggle-switch peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900 ${item.contains_example ? 'active' : ''}`}
                                />
                            </label>
                        </div>
                    </div>

                    <div className="space-y-2">
                        {examples.map((ex, idx) => {
                            if (!ex.text && editingIdx !== idx) return null;
                            return (
                                <div key={ex.key} className="example-card">
                                    <div className="flex justify-between items-start gap-2">
                                        <span className="text-xs uppercase text-amber-500/60 font-bold shrink-0 mt-1">
                                            {labels.exampleSlot || 'Ex'} {idx + 1}
                                        </span>
                                        <div className="flex-1 min-w-0">
                                            {editingIdx === idx ? (
                                                <textarea
                                                    className="custom-input text-sm font-serif min-h-[60px] bg-slate-950"
                                                    value={ex.text}
                                                    autoFocus
                                                    onChange={(e) => handleEdit(idx, e.target.value)}
                                                    onBlur={() => setEditingIdx(null)}
                                                />
                                            ) : (
                                                <p className="text-sm text-slate-300 font-serif leading-relaxed cursor-pointer hover:text-white transition-colors"
                                                    onClick={() => setEditingIdx(idx)}
                                                    title="Click to edit"
                                                >
                                                    "{ex.text}"
                                                </p>
                                            )}
                                        </div>
                                        <div className="flex gap-1 shrink-0">
                                            <button
                                                onClick={() => setEditingIdx(editingIdx === idx ? null : idx)}
                                                className="text-slate-500 hover:text-indigo-400 p-1"
                                                title="Edit"
                                            >
                                                <Icon name="pencil" size={12} />
                                            </button>
                                            <button
                                                onClick={() => handleDelete(idx)}
                                                className="text-red-700 hover:text-red-400 p-1"
                                                title="Remove example"
                                            >
                                                <Icon name="x" size={14} />
                                            </button>
                                        </div>
                                    </div>
                                    {/* Note textarea */}
                                    <div className="mt-1.5 ml-8 border-l-2 border-amber-900/30 pl-3">
                                        <textarea
                                            className="w-full text-xs text-slate-400 bg-transparent border-none resize-none focus:outline-none focus:text-slate-200 placeholder-slate-600 overflow-hidden"
                                            value={ex.note}
                                            placeholder={labels.exampleNoteHint || 'Add a note...'}
                                            onChange={(e) => handleNoteEdit(idx, e.target.value)}
                                            onFocus={(e) => { setEditingNoteIdx(idx); autoResizeTextarea(e); }}
                                            onBlur={() => setEditingNoteIdx(null)}
                                            onInput={(e) => autoResizeTextarea(e)}
                                            style={{ minHeight: '1.5rem' }}
                                            rows={1}
                                        />
                                    </div>
                                </div>
                            );
                        })}

                        {filledCount === 0 && hasExampleFlag && (
                            <div className="text-center py-4 text-slate-500 border border-dashed border-amber-900/30 rounded text-xs bg-amber-950/10">
                                <Icon name="alert-circle" size={14} className="mx-auto mb-1 text-amber-600/50" />
                                Marked as having an example, but no example text specified.
                                <br /><span className="text-slate-600">{labels.exampleEmpty || 'Highlight text in the quote above to add one.'}</span>
                            </div>
                        )}

                        {filledCount === 0 && !hasExampleFlag && (
                            <div className="text-center py-4 text-slate-600 border border-dashed border-slate-800 rounded text-xs">
                                <Icon name="highlighter" size={16} className="mx-auto mb-2 text-slate-700" />
                                {labels.exampleEmpty || 'Highlight text in the quote above, then click'} <strong className="text-indigo-400">{labels.exampleAdd || '+ Example'}</strong>
                            </div>
                        )}

                        {filledCount >= 3 && (
                            <div className="text-xs text-amber-500/60 text-center py-1">
                                All 3 {labels.exampleSlot?.toLowerCase() || 'example'} slots filled
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- DRR IMPORT REVIEW ---
        const getDrrImportReview = (result, existingRecords = []) => {
            const diagnostics = Array.isArray(result.diagnostics) ? result.diagnostics : [];
            const existingIds = new Set(existingRecords.map(record => record.report_provenance?.report_id).filter(Boolean));
            const incomingIds = new Set([...(result.items || []), ...(result.sources || [])]
                .map(record => record.report_provenance?.report_id).filter(Boolean));
            const repeatedReports = [...incomingIds].filter(id => existingIds.has(id));
            const canSave = result.can_import === true && !(result.collisions || []).length
                && !diagnostics.some(diagnostic => diagnostic.severity === 'error');
            return { diagnostics, repeatedReports, canSave, canAppend: canSave && repeatedReports.length === 0 };
        };

        const ReportMetadata = ({ report }) => {
            if (!report || typeof report !== 'object') return null;
            const metadata = report.metadata || {};
            return (
                <details className="col-span-12 bg-slate-900 border border-slate-600 rounded-lg p-4 mb-4 text-slate-200">
                    <summary className="cursor-pointer font-bold">Report metadata — {report.title || report.report_id}</summary>
                    <dl className="mt-3 text-sm space-y-2 break-words">
                        <div><dt className="inline font-bold">Report ID: </dt><dd className="inline">{report.report_id}</dd></div>
                        <div><dt className="inline font-bold">Published: </dt><dd className="inline">{metadata.publishedOn || 'Unknown / unpublished'}</dd></div>
                        <div><dt className="inline font-bold">Updated: </dt><dd className="inline">{metadata.updatedOn || 'Unknown'}</dd></div>
                    </dl>
                    <p className="text-sm text-slate-300 my-3">These are report dates. Historical event dates are recorded separately on each item. This imported metadata is retained when you save or create a project.</p>
                    <pre className="text-xs whitespace-pre-wrap break-words max-h-64 overflow-auto bg-slate-950 p-3 rounded">{JSON.stringify(metadata, null, 2)}</pre>
                </details>
            );
        };

        const DrrImportReview = ({ result, review }) => (
            <div className="mb-6 space-y-3">
                {!review.canSave && <p role="alert" className="bg-red-950 border border-red-500 text-red-100 p-4 rounded-lg">
                    Import needs attention. Saving and appending are disabled until the report errors below are resolved. The original report has not been changed.
                    {result.can_import === undefined && ' Restart Scribity to load the updated importer, then select the report again.'}
                </p>}
                {review.repeatedReports.length > 0 && <p role="alert" className="bg-amber-950 border border-amber-500 text-amber-100 p-4 rounded-lg">
                    Already in this project: {review.repeatedReports.join(', ')}. Append will not merge or replace your edits. You can save this edition to a new file.
                </p>}
                {review.diagnostics.length > 0 && <div className="space-y-3 max-h-96 overflow-y-auto" aria-label="Report import diagnostics">
                    {review.diagnostics.map((diagnostic, index) => (
                        <div key={index} className={`border rounded-lg p-3 ${diagnostic.severity === 'error' ? 'border-red-600 text-red-100 bg-red-950' : 'border-amber-600 text-amber-100 bg-amber-950'}`}>
                            <p className="font-bold text-sm">{diagnostic.severity === 'error' ? 'Error' : 'Review'} — {`${diagnostic.filename || 'Report'}:${diagnostic.line || 1}`}</p>
                            <p className="text-sm mt-1">{diagnostic.message}</p>
                            {diagnostic.excerpt && <pre className="text-xs whitespace-pre-wrap break-words mt-2 max-h-48 overflow-auto">{diagnostic.excerpt}</pre>}
                        </div>
                    ))}
                </div>}
                {(result.files || [{ report: result.report }]).map((file, index) => <ReportMetadata key={index} report={file.report} />)}
            </div>
        );

        const AdditionalInfoManager = ({ item, onChange }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [addingField, setAddingField] = useState(false);

            // Discover extra fields not handled by any known UI section
            const extraFields = useMemo(() => {
                return Object.keys(item).filter(k => !RENDERED_ELSEWHERE.has(k));
            }, [item]);

            // All fields this section is responsible for: known + extra
            const allFields = useMemo(() => {
                const combined = [...ADDITIONAL_INFO_FIELDS];
                extraFields.forEach(k => { if (!combined.includes(k)) combined.push(k); });
                return combined;
            }, [extraFields]);

            const extraFieldSet = useMemo(() => new Set(extraFields), [extraFields]);

            // Which fields currently have data?
            const fieldsWithData = allFields.filter(k => {
                const v = item[k];
                return v !== undefined && v !== null && v !== '' && v !== 0;
            });

            // Track manually shown fields (for adding empty ones)
            const [shownFields, setShownFields] = useState(new Set());

            const visibleFields = allFields.filter(k =>
                fieldsWithData.includes(k) || shownFields.has(k)
            );

            const hiddenFields = allFields.filter(k => !visibleFields.includes(k));

            const addField = (key) => {
                setShownFields(prev => new Set([...prev, key]));
                setAddingField(false);
            };

            const totalVisible = visibleFields.length;
            const extraCount = visibleFields.filter(k => extraFieldSet.has(k)).length;

            return (
                <div className="col-span-12 bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex justify-between items-center p-4 hover:bg-slate-800/30 transition-colors"
                    >
                        <span className="custom-label text-slate-400 mb-0 flex items-center gap-2 cursor-pointer">
                            <Icon name="info" size={14} className="text-slate-500" />
                            Additional Information
                            {totalVisible > 0 && (
                                <span className="text-xs bg-slate-800 text-slate-500 px-1.5 py-0.5 rounded font-mono">
                                    {totalVisible} field{totalVisible !== 1 ? 's' : ''}
                                </span>
                            )}
                            {extraCount > 0 && (
                                <span className="text-xs bg-amber-900/30 text-amber-400 px-1.5 py-0.5 rounded font-mono">
                                    {extraCount} extra
                                </span>
                            )}
                        </span>
                        <Icon name={isOpen ? 'chevron-up' : 'chevron-down'} size={16} className="text-slate-500" />
                    </button>

                    {isOpen && (
                        <div className="px-4 pb-4">
                            <div className="grid grid-cols-12 gap-4">
                                {visibleFields.map(key => {
                                    const safeValue = item[key] === undefined || item[key] === null ? '' : item[key];
                                    const isExtra = extraFieldSet.has(key);
                                    const isLong = TEXTAREA_FIELDS.includes(key) || (typeof safeValue === 'string' && safeValue.length > 100);
                                    const fieldId = `additional-field-${key}`;
                                    return (
                                        <div key={key} className={`col-span-12 ${isLong ? '' : 'md:col-span-6'}`}>
                                            <label htmlFor={fieldId} className="custom-label flex items-center gap-1">
                                                {key.replace(/_/g, ' ')}
                                                {isExtra && <span className="text-xs bg-amber-900/40 text-amber-400 px-1 py-0.5 rounded font-bold ml-1">EXTRA</span>}
                                            </label>
                                            {isLong ? (
                                                <textarea
                                                    id={fieldId}
                                                    className="custom-input min-h-[60px] font-serif"
                                                    value={typeof safeValue === 'object' ? JSON.stringify(safeValue) : safeValue}
                                                    onChange={(e) => onChange(key, e.target.value)}
                                                />
                                            ) : (
                                                <input
                                                    id={fieldId}
                                                    className="custom-input"
                                                    value={typeof safeValue === 'object' ? JSON.stringify(safeValue) : safeValue}
                                                    onChange={(e) => onChange(key, e.target.value)}
                                                />
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {hiddenFields.length > 0 && (
                                <div className="mt-3 flex items-center gap-2">
                                    {addingField ? (
                                        <select
                                            className="bg-slate-950 border border-slate-700 text-slate-300 text-xs rounded px-2 py-1"
                                            autoFocus
                                            value=""
                                            onChange={(e) => { if (e.target.value) addField(e.target.value); }}
                                            onBlur={() => setAddingField(false)}
                                        >
                                            <option value="">-- Add a field --</option>
                                            {hiddenFields.map(k => (
                                                <option key={k} value={k}>{k.replace(/_/g, ' ')}{extraFieldSet.has(k) ? ' (extra)' : ''}</option>
                                            ))}
                                        </select>
                                    ) : (
                                        <button
                                            onClick={() => setAddingField(true)}
                                            className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1 rounded font-bold border border-slate-700 flex items-center gap-1"
                                        >
                                            <Icon name="plus" size={12} /> Add Field
                                        </button>
                                    )}
                                </div>
                            )}

                            {visibleFields.length === 0 && !addingField && (
                                <div className="text-center py-4 text-slate-600 text-xs">
                                    No additional fields set. Click "Add Field" to add one.
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            // Data States
            const [items, setItems] = useState([]);
            const [sources, setSources] = useState([]);
            const sourceById = useMemo(() => {
                const map = new Map();
                sources.forEach(source => {
                    // Match Array.find semantics if malformed data contains duplicate IDs.
                    if (!map.has(source.id_source)) map.set(source.id_source, source);
                });
                return map;
            }, [sources]);

            // UI States
            const [view, setView] = useState('library'); // library, sources, inspector
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [selectedSourceId, setSelectedSourceId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [status, setStatus] = useState('Ready');
            const [loadError, setLoadError] = useState(null);
            const [itemsReady, setItemsReady] = useState(false);
            const [sourcesReady, setSourcesReady] = useState(false);
            const [selectedRule, setSelectedRule] = useState('__all__');
            const [selectedSubpart, setSelectedSubpart] = useState(null); // null = show general (no-subpart) items; string = specific subpart

            // Conditional schema mode (research vs improv)
            const [schemaMode, setSchemaMode] = useState('improv');
            const schemaModeRef = useRef(schemaMode);
            schemaModeRef.current = schemaMode;
            const labels = SCHEMA_LABELS[schemaMode];
            const [stageRule, setStageRule] = useState(null); // rule pinned in Stage
            const [stageSubpart, setStageSubpart] = useState(null); // null = general only, '__all_rule__' = all, string = specific subpart
            const [sidebarEditMode, setSidebarEditMode] = useState(false);
            const [expandedRules, setExpandedRules] = useState(new Set());
            const [floatingBtn, setFloatingBtn] = useState(null);
            const [showCreateMenu, setShowCreateMenu] = useState(false);
            const [showSaveMenu, setShowSaveMenu] = useState(false);
            const [newDocModal, setNewDocModal] = useState(false);
            const createButtonRef = useRef(null);
            const [sidebarWidth, setSidebarWidth] = useState(300);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const sidebarWidthBeforeCollapse = useRef(300);

            // Stage panel
            const [stageOpen, setStageOpen] = useState(false);
            const [stageWidth, setStageWidth] = useState(320);
            const isStageResizing = useRef(false);
            const stageDragIdx = useRef(null);
            const [stageDragOverIdx, setStageDragOverIdx] = useState(null);
            const [supportTarget, setSupportTarget] = useState(null); // { surface: 'draft' | 'stage', parentId }

            // E013: Bulk selection
            const [bulkSelectedIds, setBulkSelectedIds] = useState(new Set());
            const lastBulkClickIdx = useRef(null);

            // E009: Error toast
            const [errorToast, setErrorToast] = useState(null);
            const errorToastTimer = useRef(null);
            const showErrorToast = useCallback((msg) => {
                setErrorToast(msg);
                if (errorToastTimer.current) clearTimeout(errorToastTimer.current);
                errorToastTimer.current = setTimeout(() => setErrorToast(null), 6000);
            }, []);

            // E016: Undo/Redo stacks
            const undoStack = useRef([]);
            const redoStack = useRef([]);
            const sourceUndoStack = useRef([]);
            const sourceRedoStack = useRef([]);
            const sourceUndoSnapshot = useRef(null);
            const sourcesHistoryDocumentToken = useRef(null);
            const itemsHistoryDocumentToken = useRef(null);
            const UNDO_LIMIT = 30;

            // E016: Delete undo toast (supports items + sources)
            const [deleteToast, setDeleteToast] = useState(null); // { message, restoreType, previousData }
            const deleteToastTimer = useRef(null);
            const showDeleteToast = (msg, restoreType, prevData) => {
                setDeleteToast({ message: msg, restoreType, previousData: prevData });
                if (deleteToastTimer.current) clearTimeout(deleteToastTimer.current);
                deleteToastTimer.current = setTimeout(() => setDeleteToast(null), 6000);
            };

            // E016: Suppressible delete confirmation
            const [suppressDeleteConfirm, setSuppressDeleteConfirm] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null); // { title, message, detail, confirmLabel, onConfirm }
            const requestDeleteConfirmation = ({ title, message, detail, confirmLabel = 'Delete', onConfirm }) => {
                if (suppressDeleteConfirm) {
                    onConfirm();
                    return;
                }
                setDeleteConfirm({ title, message, detail, confirmLabel, onConfirm });
            };

            // E015: Quick-filter chips
            const [activeFilters, setActiveFilters] = useState(new Set());
            const QUICK_FILTERS = [
                { key: 'hasExamples', label: `Has ${labels.examplesTitle || 'Examples'}`, icon: 'lightbulb', color: 'amber' },
                { key: 'noSource', label: 'No Source', icon: 'unlink', color: 'red' },
                { key: 'inDraft', label: 'In Draft', icon: 'list', color: 'green' },
                { key: 'notInDraft', label: 'Not In Draft', icon: 'list-x', color: 'slate' },
                { key: 'hasComments', label: 'Has Comments', icon: 'message-square', color: 'blue' },
                { key: 'notCategorized', label: 'Not Categorized', icon: 'inbox', color: 'purple' },
            ];
            const toggleFilter = (key) => {
                const next = new Set(activeFilters);
                // Mutually exclusive: inDraft / notInDraft
                if (key === 'inDraft' && next.has('notInDraft')) next.delete('notInDraft');
                if (key === 'notInDraft' && next.has('inDraft')) next.delete('inDraft');
                if (next.has(key)) next.delete(key);
                else next.add(key);
                setActiveFilters(next);
            };

            // E006: Searchable field selection (labels adapt to schema mode)
            const SEARCH_FIELDS = useMemo(() => [
                { key: 'quote_original', label: 'Quote' },
                { key: 'example', label: 'Example 1' },
                { key: 'example_02', label: 'Example 2' },
                { key: 'example_03', label: 'Example 3' },
                { key: 'user_01_comments', label: labels.user_01 },
                { key: 'user_02_comments', label: labels.user_02 },
                { key: 'short_cite', label: 'Citation' },
                { key: 'rule_name', label: `${labels.rule} Name` },
                { key: 'subpart_name', label: 'Subpart Name' },
                { key: 'id_item', label: 'Item ID' },
            ], [labels]);
            const [searchFields, setSearchFields] = useState(() => new Set(SEARCH_FIELDS.map(f => f.key)));
            const [showSearchFields, setShowSearchFields] = useState(false);
            const searchFieldsRef = useRef(null);
            useEffect(() => {
                if (!showSearchFields) return;
                const handleOutsideClick = (e) => {
                    if (searchFieldsRef.current && !searchFieldsRef.current.contains(e.target)) {
                        setShowSearchFields(false);
                    }
                };
                document.addEventListener('mousedown', handleOutsideClick);
                return () => document.removeEventListener('mousedown', handleOutsideClick);
            }, [showSearchFields]);

            // Draft/Render state
            const [selectedScriptPart, setSelectedScriptPart] = useState('__all__');
            const [hideFactsInRender, setHideFactsInRender] = useState(false);
            const isResizing = useRef(false);
            const draftSaveTimer = useRef(null);
            const inspectorSaveTimer = useRef(null);
            const inspectorUndoSnapshot = useRef(null); // Captures pre-edit state for undo
            const sourceSaveTimer = useRef(null);
            const exampleNoteSaveTimer = useRef(null);

            // Serialize saves and coalesce intermediate snapshots while a request is active.
            // This prevents older requests from finishing after newer ones and overwriting them.
            const itemsSaveQueue = useRef({ inFlight: false, pending: null, lastError: null, idleWaiters: [] });
            const sourcesSaveQueue = useRef({ inFlight: false, pending: null, lastError: null, idleWaiters: [] });

            // DRR Parser state
            const [parseResult, setParseResult] = useState(null);
            const [parseLoading, setParseLoading] = useState(false);
            const [parseSaving, setParseSaving] = useState(false);
            const [parseError, setParseError] = useState(null);

            // Project extraction is a separate copy operation, never Save As.
            const [projectModal, setProjectModal] = useState(false);
            const draftProjectButtonRef = useRef(null);
            const [projectScope, setProjectScope] = useState('draft');
            const [projectEmptyDraft, setProjectEmptyDraft] = useState(true);
            const [projectPreview, setProjectPreview] = useState(null);
            const [projectSaved, setProjectSaved] = useState(null);
            const [projectBusy, setProjectBusy] = useState(false);
            const [projectError, setProjectError] = useState('');
            const [projectAcknowledged, setProjectAcknowledged] = useState(false);
            const [projectManualPaths, setProjectManualPaths] = useState(false);
            const [projectItemsPath, setProjectItemsPath] = useState('');
            const [projectSourcesPath, setProjectSourcesPath] = useState('');

            // File tracking
            const [itemsFilename, setItemsFilename] = useState('No file');
            const [sourcesFilename, setSourcesFilename] = useState('No file');
            const [itemsDocument, setItemsDocument] = useState({ token: null, revision: null });
            const [sourcesDocument, setSourcesDocument] = useState({ token: null, revision: null });
            const itemsDocumentRef = useRef(itemsDocument);
            const sourcesDocumentRef = useRef(sourcesDocument);

            const applyDocumentState = (document, state) => {
                if (!state || typeof state.token !== 'string' || !Number.isInteger(state.revision)) return;
                const next = { token: state.token, revision: state.revision };
                if (document === 'items') {
                    itemsDocumentRef.current = next;
                    setItemsDocument(next);
                } else {
                    sourcesDocumentRef.current = next;
                    setSourcesDocument(next);
                }
            };

            const clearTimerRef = (timerRef) => {
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = null;
            };

            const resetSaveQueueForActivation = (queueRef) => {
                const queue = queueRef.current;
                queue.pending = null;
                queue.lastError = null;
                if (!queue.inFlight) {
                    const waiters = queue.idleWaiters.splice(0);
                    waiters.forEach(({ resolve }) => resolve());
                }
            };

            const clearDeleteUndoFor = (restoreType) => {
                if (deleteToast?.restoreType !== restoreType) return;
                clearTimerRef(deleteToastTimer);
                setDeleteToast(null);
            };

            const resetItemsDocumentSession = (document) => {
                [inspectorSaveTimer, draftSaveTimer, exampleNoteSaveTimer].forEach(clearTimerRef);
                inspectorUndoSnapshot.current = null;
                undoStack.current = [];
                redoStack.current = [];
                itemsHistoryDocumentToken.current = document.token;
                resetSaveQueueForActivation(itemsSaveQueue);
                clearDeleteUndoFor('items');
                setDeleteConfirm(null);
                setSelectedItemId(null);
                setSelectedRule('__all__');
                setSelectedSubpart(null);
                setStageRule(null);
                setStageSubpart(null);
                setStageOpen(false);
                setExpandedRules(new Set());
                setBulkSelectedIds(new Set());
                lastBulkClickIdx.current = null;
                setSelectedScriptPart('__all__');
                setActiveFilters(new Set());
                setSearchQuery('');
                setFloatingBtn(null);
                stageDragIdx.current = null;
                setStageDragOverIdx(null);
                setView('library');
            };

            const discardStaleItemHistory = () => {
                if (itemsHistoryDocumentToken.current !== itemsDocumentRef.current.token) {
                    [inspectorSaveTimer, draftSaveTimer, exampleNoteSaveTimer].forEach(clearTimerRef);
                    inspectorUndoSnapshot.current = null;
                    undoStack.current = [];
                    redoStack.current = [];
                    itemsHistoryDocumentToken.current = itemsDocumentRef.current.token;
                    return true;
                }
                return false;
            };

            const resetSourcesDocumentSession = (document) => {
                sourceUndoStack.current = [];
                sourceRedoStack.current = [];
                sourceUndoSnapshot.current = null;
                sourcesHistoryDocumentToken.current = document.token;
                clearTimerRef(sourceSaveTimer);
                resetSaveQueueForActivation(sourcesSaveQueue);
                clearDeleteUndoFor('sources');
                setDeleteConfirm(null);
                setSelectedSourceId(null);
            };

            const activateItemsDocument = ({ rawItems, filename, document, mode = null }) => {
                const nextMode = mode || detectSchemaMode(rawItems);
                const nextItems = normalizeItems(rawItems, nextMode);
                applyDocumentState('items', document);
                resetItemsDocumentSession(document);
                itemsRef.current = nextItems;
                setSchemaMode(nextMode);
                setItems(nextItems);
                setItemsReady(true);
                setItemsFilename(filename || 'items.json');
            };
