            const activateSourcesDocument = ({ sources: nextSources, filename, document }) => {
                applyDocumentState('sources', document);
                resetSourcesDocumentSession(document);
                sourcesRef.current = nextSources;
                setSources(nextSources);
                setSourcesReady(true);
                setSourcesFilename(filename || 'sources.json');
            };

            const readApiResponse = async (response) => {
                let payload;
                try {
                    payload = await response.json();
                } catch (error) {
                    throw new Error(`Server returned an unreadable response (HTTP ${response.status}).`);
                }
                if (!response.ok || payload?.status === 'error') {
                    const apiError = new Error(payload?.message || `Request failed with HTTP ${response.status}.`);
                    apiError.kind = payload?.kind;
                    apiError.document = payload?.document;
                    apiError.itemsDocument = payload?.items_document;
                    apiError.sourcesDocument = payload?.sources_document;
                    throw apiError;
                }
                return payload;
            };

            const reportLoadError = (error) => {
                const message = error?.message || 'The document could not be loaded.';
                setLoadError(message);
                setStatus('Load Error');
                showErrorToast(message);
            };

            // --- FILE PICKER HANDLERS ---
            const openItemsPicker = async () => {
                setStatus('Opening file picker...');
                try {
                    await flushPendingDocumentSaves('items');
                    const res = await api('open_items', { method: 'POST' });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        const rawPicked = json.data || [];
                        const pickedMode = detectSchemaMode(rawPicked);
                        activateItemsDocument({
                            rawItems: rawPicked,
                            filename: json.filename,
                            document: json.document,
                            mode: pickedMode,
                        });
                        setLoadError(null);
                        setStatus(`Items loaded (${pickedMode})`);
                    } else if (json.status === 'gui_unavailable') {
                        const path = prompt('Tkinter unavailable. Enter full path to Items JSON file:');
                        if (path) {
                            const manualRes = await api('switch_items', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path })
                            });
                            const manualJson = await readApiResponse(manualRes);
                            if (manualJson.status === 'success') {
                                const rawManual = manualJson.data || [];
                                const manualMode = detectSchemaMode(rawManual);
                                activateItemsDocument({
                                    rawItems: rawManual,
                                    filename: manualJson.filename,
                                    document: manualJson.document,
                                    mode: manualMode,
                                });
                                setLoadError(null);
                                setStatus(`Items loaded (${manualMode})`);
                            }
                        }
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    }
                } catch (e) {
                    reportLoadError(e);
                }
            };

            const openSourcesPicker = async () => {
                setStatus('Opening file picker...');
                try {
                    await flushPendingDocumentSaves('sources');
                    const res = await api('open_sources', { method: 'POST' });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        activateSourcesDocument({
                            sources: json.data || [],
                            filename: json.filename,
                            document: json.document,
                        });
                        setLoadError(null);
                        setStatus('Sources loaded');
                    } else if (json.status === 'gui_unavailable') {
                        const path = prompt('Tkinter unavailable. Enter full path to Sources JSON file:');
                        if (path) {
                            const manualRes = await api('switch_sources', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path })
                            });
                            const manualJson = await readApiResponse(manualRes);
                            if (manualJson.status === 'success') {
                                activateSourcesDocument({
                                    sources: manualJson.data || [],
                                    filename: manualJson.filename,
                                    document: manualJson.document,
                                });
                                setLoadError(null);
                                setStatus('Sources loaded');
                            }
                        }
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    }
                } catch (e) {
                    reportLoadError(e);
                }
            };

            // --- SERVER IO ---
            const fetchData = async () => {
                setStatus('Loading...');
                try {
                    const res = await api('data');
                    const json = await readApiResponse(res);
                    const rawItems = json.items || [];
                    const mode = detectSchemaMode(rawItems);
                    activateItemsDocument({
                        rawItems,
                        filename: json.items_filename,
                        document: json.items_document,
                        mode,
                    });
                    activateSourcesDocument({
                        sources: json.sources || [],
                        filename: json.sources_filename,
                        document: json.sources_document,
                    });
                    setLoadError(null);
                    setStatus(`Loaded (${mode})`);
                } catch (e) {
                    applyDocumentState('items', e.itemsDocument);
                    applyDocumentState('sources', e.sourcesDocument);
                    setItemsReady(false);
                    setSourcesReady(false);
                    reportLoadError(e);
                }
            };

            // Ref to always have current items for undo (avoids stale closure)
            const itemsRef = useRef(items);
            itemsRef.current = items;
            const sourcesRef = useRef(sources);
            sourcesRef.current = sources;

            const waitForSaveQueue = (queueRef) => {
                const queue = queueRef.current;
                if (!queue.inFlight) {
                    return queue.lastError ? Promise.reject(queue.lastError) : Promise.resolve();
                }
                return new Promise((resolve, reject) => {
                    queue.idleWaiters.push({ resolve, reject });
                });
            };

            const enqueueSave = (queueRef, job) => {
                const queue = queueRef.current;
                queue.pending = job;
                queue.lastError = null;
                setStatus(job.savingStatus);

                if (queue.inFlight) return;
                queue.inFlight = true;

                const drain = async () => {
                    let activeJob = null;
                    let finalStatus = job.successStatus;
                    try {
                        while (queue.pending) {
                            activeJob = queue.pending;
                            queue.pending = null;
                            const activeDocument = activeJob.documentRef.current;
                            if (activeDocument.token !== activeJob.originDocument.token) {
                                continue;
                            }
                            const response = await api(activeJob.endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: activeJob.serialize(activeDocument)
                            });
                            const payload = await readApiResponse(response);
                            if (activeJob.documentRef.current.token !== activeJob.originDocument.token) {
                                continue;
                            }
                            activeJob.applyResponse(payload);
                            finalStatus = activeJob.successStatus;
                        }
                        setStatus(finalStatus);
                    } catch (error) {
                        queue.pending = null;
                        queue.lastError = error;
                        setStatus('Save Error');
                        const message = error?.kind === 'stale_document'
                            ? error.message
                            : (activeJob?.errorMessage || error?.message || 'Failed to save — server may be down');
                        showErrorToast(message);
                        console.error(error);
                    } finally {
                        queue.inFlight = false;
                        const waiters = queue.idleWaiters.splice(0);
                        waiters.forEach(({ resolve, reject }) => {
                            if (queue.lastError) reject(queue.lastError);
                            else resolve();
                        });
                    }
                };

                void drain();
            };

            const queueItemsSave = (newItems, successStatus = 'Saved') => {
                if (!itemsReady) {
                    showErrorToast('Items were not saved because no valid items document is loaded.');
                    setStatus('Save Blocked');
                    return false;
                }
                const mode = schemaModeRef.current;
                const originDocument = { ...itemsDocumentRef.current };
                enqueueSave(itemsSaveQueue, {
                    endpoint: 'save_items',
                    originDocument,
                    documentRef: itemsDocumentRef,
                    serialize: (activeDocument) => JSON.stringify({
                        data: denormalizeItems(newItems, mode),
                        document_token: originDocument.token,
                        revision: activeDocument.revision,
                    }),
                    applyResponse: (payload) => applyDocumentState('items', payload.document),
                    savingStatus: 'Saving Items...',
                    successStatus,
                    errorMessage: 'Failed to save items — server may be down'
                });
                return true;
            };

            const queueSourcesSave = (newSources, successStatus = 'Saved') => {
                if (!sourcesReady) {
                    showErrorToast('Sources were not saved because no valid sources document is loaded.');
                    setStatus('Save Blocked');
                    return false;
                }
                const originDocument = { ...sourcesDocumentRef.current };
                enqueueSave(sourcesSaveQueue, {
                    endpoint: 'save_sources',
                    originDocument,
                    documentRef: sourcesDocumentRef,
                    serialize: (activeDocument) => JSON.stringify({
                        data: newSources,
                        document_token: originDocument.token,
                        revision: activeDocument.revision,
                    }),
                    applyResponse: (payload) => applyDocumentState('sources', payload.document),
                    savingStatus: 'Saving Sources...',
                    successStatus,
                    errorMessage: 'Failed to save sources — server may be down'
                });
                return true;
            };

            const flushPendingDocumentSaves = async (document) => {
                if (document === 'items') {
                    if (commitPendingItemEdit()) queueItemsSave(itemsRef.current, 'Saved before switching');
                    await waitForSaveQueue(itemsSaveQueue);
                    return;
                }

                if (commitPendingSourceEdit()) queueSourcesSave(sourcesRef.current, 'Saved before switching');
                await waitForSaveQueue(sourcesSaveQueue);
            };

            const flushAllPendingDocumentSaves = async () => {
                await Promise.all([
                    flushPendingDocumentSaves('items'),
                    flushPendingDocumentSaves('sources'),
                ]);
            };

            // --- DOCUMENT HISTORY ---
            const rememberChange = (stack, redo, snapshot) => {
                stack.current.push(snapshot);
                if (stack.current.length > UNDO_LIMIT) stack.current.shift();
                redo.current = [];
            };

            const commitPendingItemEdit = () => {
                [inspectorSaveTimer, draftSaveTimer, exampleNoteSaveTimer].forEach(clearTimerRef);
                if (!inspectorUndoSnapshot.current) return false;
                rememberChange(undoStack, redoStack, inspectorUndoSnapshot.current);
                inspectorUndoSnapshot.current = null;
                return true;
            };

            const commitPendingSourceEdit = () => {
                clearTimerRef(sourceSaveTimer);
                if (!sourceUndoSnapshot.current) return false;
                rememberChange(sourceUndoStack, sourceRedoStack, sourceUndoSnapshot.current);
                sourceUndoSnapshot.current = null;
                return true;
            };

            const stageItemEdit = (newItems, timer = inspectorSaveTimer) => {
                if (!itemsReady) return;
                if (!inspectorUndoSnapshot.current) inspectorUndoSnapshot.current = itemsRef.current;
                redoStack.current = [];
                itemsRef.current = newItems;
                setItems(newItems);
                clearTimerRef(timer);
                timer.current = setTimeout(() => {
                    if (commitPendingItemEdit()) queueItemsSave(itemsRef.current);
                }, 600);
            };

            const stageSourceEdit = (newSources) => {
                if (!sourcesReady) return;
                if (!sourceUndoSnapshot.current) sourceUndoSnapshot.current = sourcesRef.current;
                sourceRedoStack.current = [];
                sourcesRef.current = newSources;
                setSources(newSources);
                clearTimerRef(sourceSaveTimer);
                sourceSaveTimer.current = setTimeout(() => {
                    if (commitPendingSourceEdit()) queueSourcesSave(sourcesRef.current);
                }, 600);
            };

            const saveItems = (newItems) => {
                if (!itemsReady) {
                    showErrorToast('Create or open a valid items document before making changes.');
                    setStatus('Save Blocked');
                    return false;
                }
                commitPendingItemEdit();
                rememberChange(undoStack, redoStack, itemsRef.current);
                itemsRef.current = newItems;
                setItems(newItems);
                queueItemsSave(newItems);
                return true;
            };

            const saveSources = (newSources) => {
                if (!sourcesReady) {
                    showErrorToast('Create or open a valid sources document before making changes.');
                    setStatus('Save Blocked');
                    return false;
                }
                commitPendingSourceEdit();
                rememberChange(sourceUndoStack, sourceRedoStack, sourcesRef.current);
                sourcesRef.current = newSources;
                setSources(newSources);
                queueSourcesSave(newSources);
                return true;
            };

            const restoreHistory = (direction) => {
                if (projectModal || newDocModal || deleteConfirm) return;
                const isSource = view === 'sources';
                if (isSource ? !sourcesReady : !itemsReady) return;
                if (isSource && sourcesHistoryDocumentToken.current !== sourcesDocumentRef.current.token) {
                    sourceUndoStack.current = [];
                    sourceRedoStack.current = [];
                    sourceUndoSnapshot.current = null;
                    clearTimerRef(sourceSaveTimer);
                    sourcesHistoryDocumentToken.current = sourcesDocumentRef.current.token;
                    setStatus('History cleared for opened sources document');
                    return;
                }
                if (!isSource && discardStaleItemHistory()) {
                    setStatus('History cleared for opened items document');
                    return;
                }
                // Commit the pre-typing snapshot and cancel every delayed callback
                // before restoring, so a timer cannot overwrite the undone state.
                if (isSource) commitPendingSourceEdit();
                else commitPendingItemEdit();
                const undo = isSource ? sourceUndoStack : undoStack;
                const redo = isSource ? sourceRedoStack : redoStack;
                const from = direction === 'undo' ? undo : redo;
                const to = direction === 'undo' ? redo : undo;
                if (!from.current.length) return;
                const ref = isSource ? sourcesRef : itemsRef;
                to.current.push(ref.current);
                if (to.current.length > UNDO_LIMIT) to.current.shift();
                const restored = from.current.pop();
                ref.current = restored;
                clearDeleteUndoFor(isSource ? 'sources' : 'items');
                if (isSource) {
                    setSources(restored);
                    queueSourcesSave(restored, `Saved (${direction})`);
                } else {
                    setItems(restored);
                    queueItemsSave(restored, `Saved (${direction})`);
                }
            };

            const handleHistoryShortcut = (event) => {
                if (event.defaultPrevented || event.isComposing || event.altKey || !(event.ctrlKey || event.metaKey)) return false;
                const key = event.key.toLowerCase();
                const direction = key === 'z' ? (event.shiftKey ? 'redo' : 'undo')
                    : (key === 'y' && event.ctrlKey && !event.metaKey && !event.shiftKey ? 'redo' : null);
                if (!direction) return false;
                const active = document.activeElement;
                const isEditor = element => element?.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(element?.tagName?.toUpperCase());
                if (isEditor(active) || isEditor(event.target) || projectModal || newDocModal || deleteConfirm) return true;
                event.preventDefault();
                restoreHistory(direction);
                return true;
            };

            useEffect(() => { fetchData(); }, []);

            // --- COMPUTED DATA ---

            // Build hierarchical rule structure for sidebar
            const { ruleHierarchy, ruleByName } = useMemo(() => {
                const ruleMap = new Map(); // key: rule_name, value: { number, name, subparts: Map, itemCount, generalItemCount }

                items.forEach(item => {
                    const ruleNames = Array.isArray(item.rule_name) ? item.rule_name : [];
                    const ruleNums = Array.isArray(item.rule_number) ? item.rule_number : [];
                    const subpartNums = Array.isArray(item.subpart_number) ? item.subpart_number : [];
                    const subpartNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];

                    ruleNames.forEach((name, idx) => {
                        if (!name) return;
                        const num = ruleNums[idx] || '';
                        const subNum = subpartNums[idx] || '';
                        const subName = subpartNames[idx] || '';

                        if (!ruleMap.has(name)) {
                            ruleMap.set(name, { number: num, name: name, subparts: new Map(), itemCount: 0, generalItemCount: 0 });
                        }
                        const rule = ruleMap.get(name);
                        rule.itemCount++;
                        if (!rule.number && num) rule.number = num;

                        // Add subpart if exists, otherwise count as general
                        if (subNum || subName) {
                            const subKey = subNum || subName;
                            if (!rule.subparts.has(subKey)) {
                                rule.subparts.set(subKey, { number: subNum, name: subName, itemCount: 0 });
                            }
                            rule.subparts.get(subKey).itemCount++;
                        } else {
                            rule.generalItemCount++;
                        }
                    });
                });

                // Convert to array and sort: numbered rules first, then alphabetical
                const hierarchy = Array.from(ruleMap.values())
                    .map(r => ({ ...r, subparts: Array.from(r.subparts.values()).sort((a, b) => String(a.number || a.name).localeCompare(String(b.number || b.name), undefined, { numeric: true, sensitivity: 'base' })) }))
                    .sort((a, b) => {
                        if (a.number && !b.number) return -1;
                        if (!a.number && b.number) return 1;
                        if (a.number && b.number) return String(a.number).localeCompare(String(b.number), undefined, { numeric: true, sensitivity: 'base' });
                        return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                    });

                return { ruleHierarchy: hierarchy, ruleByName: ruleMap };
            }, [items]);

            // Filtered Items for Main View + search match map (computed together to avoid setState during render)
            const { filteredItems, searchMatchMap } = useMemo(() => {
                let filtered = items;

                // 1. Filter by Rule
                if (selectedRule !== '__all__') {
                    filtered = filtered.filter(item => {
                        if (!Array.isArray(item.rule_name)) return false;
                        const rNames = item.rule_name;
                        const sNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];

                        // Find indices where this rule appears
                        const matchingIndices = rNames.reduce((acc, rn, i) => {
                            if (rn === selectedRule) acc.push(i);
                            return acc;
                        }, []);

                        if (matchingIndices.length === 0) return false;

                        if (selectedSubpart === '__all_rule__') {
                            // All-rule view: show ALL items for this rule (general + all subparts)
                            return true;
                        } else if (selectedSubpart === null) {
                            // General view: show items where this rule has NO subpart (empty/missing)
                            return matchingIndices.some(i => !sNames[i]);
                        } else {
                            // Subpart view: show items where this rule has the matching subpart
                            return matchingIndices.some(i => sNames[i] === selectedSubpart);
                        }
                    });
                }

                // 2. E006: Filter by Search across selected fields
                const matchMap = new Map();
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(item => {
                        for (const f of SEARCH_FIELDS) {
                            if (!searchFields.has(f.key)) continue;
                            const val = item[f.key];
                            if (Array.isArray(val)) {
                                if (val.some(v => (v || '').toString().toLowerCase().includes(q))) {
                                    matchMap.set(item.id_item, f.label);
                                    return true;
                                }
                            } else if ((val || '').toString().toLowerCase().includes(q)) {
                                matchMap.set(item.id_item, f.label);
                                return true;
                            }
                        }
                        return false;
                    });
                }

                // 3. E015: Quick-filter chips
                if (activeFilters.size > 0) {
                    filtered = filtered.filter(item => {
                        if (activeFilters.has('hasExamples') && !item.contains_example) return false;
                        if (activeFilters.has('noSource') && item.id_source) return false;
                        if (activeFilters.has('inDraft') && !(item.id_script > 0)) return false;
                        if (activeFilters.has('notInDraft') && item.id_script > 0) return false;
                        if (activeFilters.has('hasComments') && !(item.user_01_comments && item.user_01_comments.trim())) return false;
                        if (activeFilters.has('notCategorized') && Array.isArray(item.rule_name) && item.rule_name.some(r => r)) return false;
                        return true;
                    });
                }

                return { filteredItems: filtered, searchMatchMap: matchMap };
            }, [items, selectedRule, selectedSubpart, searchQuery, searchFields, activeFilters]);

            // E008: Arrow key shortcuts for Prev/Next in inspector
            // E016: Ctrl+Z / Ctrl+Shift+Z undo/redo
            useEffect(() => {
                const handler = (e) => {
                    if (handleHistoryShortcut(e)) return;
                    if (projectModal || newDocModal || deleteConfirm) return;
                    // E008: Arrow keys for inspector
                    if (view !== 'inspector' || !selectedItemId) return;
                    const tag = document.activeElement?.tagName?.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        const idx = filteredItems.findIndex(i => i.id_item === selectedItemId);
                        if (idx === -1) return;
                        const next = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
                        if (next >= 0 && next < filteredItems.length) {
                            setSelectedItemId(filteredItems[next].id_item);
                            const container = document.getElementById('inspector-scroll-container');
                            if (container) container.scrollTop = 0;
                        }
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [view, selectedItemId, filteredItems, showErrorToast, itemsReady, sourcesReady, projectModal, newDocModal, deleteConfirm]);

            const projectScopeDescription = projectScope === 'draft'
                ? 'All top-level Draft items across the entire project, plus every supporting descendant. Search, category, quick filters, and Draft part filters do not narrow this scope.'
                : projectScope === 'checked'
                    ? `${bulkSelectedIds.size} checked items across the library, including checks outside the current filters, plus every supporting descendant.`
                    : `${filteredItems.length} current Library results, plus every supporting descendant. Category: ${selectedRule}; subpart: ${selectedSubpart ?? 'general'}; search: ${searchQuery || '(none)'}; search fields: ${[...searchFields].join(', ')}; quick filters: ${[...activeFilters].join(', ') || '(none)'}. Draft part filters do not apply.`;

            const invalidateProjectPreview = () => {
                setProjectPreview(null);
                setProjectAcknowledged(false);
                setProjectError('');
            };

            const beginProjectExtraction = () => {
                setShowCreateMenu(false);
                setProjectScope('draft');
                setProjectEmptyDraft(true);
                invalidateProjectPreview();
                setProjectSaved(null);
                setProjectManualPaths(false);
                setProjectItemsPath('');
                setProjectSourcesPath('');
                setProjectModal(true);
            };

            const previewProject = async () => {
                setProjectBusy(true);
                invalidateProjectPreview();
                try {
                    await flushAllPendingDocumentSaves();
                    const response = await api('preview_project', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            scope: projectScope,
                            selected_ids: projectScope === 'checked' ? [...bulkSelectedIds]
                                : projectScope === 'filtered' ? filteredItems.map(item => item.id_item) : [],
                            empty_draft: projectEmptyDraft,
                            items_document: itemsDocumentRef.current,
                            sources_document: sourcesDocumentRef.current,
                        }),
                    });
                    setProjectPreview(await readApiResponse(response));
                } catch (error) {
                    setProjectError(error.message);
                } finally { setProjectBusy(false); }
            };

            const saveProject = async () => {
                setProjectBusy(true);
                setProjectError('');
                try {
                    await flushAllPendingDocumentSaves();
                    const response = await api('save_project', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            preview_token: projectPreview.preview_token,
                            ...(projectManualPaths ? { items_path: projectItemsPath, sources_path: projectSourcesPath } : {}),
                        }),
                    });
                    const saved = await readApiResponse(response);
                    if (saved.status === 'canceled') {
                        setProjectError('Save canceled. No project files were created; the original project remains open.');
                    } else if (saved.status === 'gui_unavailable') {
                        setProjectManualPaths(true);
                        setProjectError(saved.message);
                    } else if (saved.status === 'success') {
                        setProjectSaved(saved);
                    }
                } catch (error) {
                    setProjectError(error.message);
                } finally { setProjectBusy(false); }
            };

            const openSavedProject = async () => {
                setProjectBusy(true);
                setProjectError('');
                try {
                    await flushAllPendingDocumentSaves();
                    const response = await api('open_project', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            project_token: projectSaved.project_token,
                            items_document: itemsDocumentRef.current,
                            sources_document: sourcesDocumentRef.current,
                        }),
                    });
                    const opened = await readApiResponse(response);
                    activateItemsDocument({ rawItems: opened.items, filename: opened.items_filename, document: opened.items_document });
                    activateSourcesDocument({ sources: opened.sources, filename: opened.sources_filename, document: opened.sources_document });
                    setSupportTarget(null);
                    setLoadError(null);
                    setStatus('Opened new project');
                    setProjectModal(false);
                } catch (error) {
                    setProjectError(error.message);
                } finally { setProjectBusy(false); }
            };

            // Helper to get Source info for an Item
            const getSourceForItem = (item) => {
                if (!item || !item.id_source) return null;
                return sourceById.get(item.id_source);
            };

            // --- EDITORS ---

            const handleItemChange = (field, value) => {
                if (!selectedItemId || !itemsReady) return;
                stageItemEdit(itemsRef.current.map(i => i.id_item === selectedItemId ? { ...i, [field]: value } : i));
            };

            const handleSourceChange = (id, field, value) => {
                if (!sourcesReady) return;
                stageSourceEdit(sourcesRef.current.map(s => s.id_source === id ? { ...s, [field]: value } : s));
            };

            // Bulk update rule name/number for all items with a specific rule_name
            const updateRuleForAll = (oldRuleName, newRuleName, newRuleNumber) => {
                if (!itemsReady) return;
                const newItems = items.map(item => {
                    if (!Array.isArray(item.rule_name) || !item.rule_name.includes(oldRuleName)) return item;

                    const idx = item.rule_name.indexOf(oldRuleName);
                    const updatedRuleNames = [...item.rule_name];
                    const updatedRuleNums = Array.isArray(item.rule_number) ? [...item.rule_number] : [];

                    if (newRuleName !== null) updatedRuleNames[idx] = newRuleName;
                    if (newRuleNumber !== null) {
                        while (updatedRuleNums.length <= idx) updatedRuleNums.push('');
                        updatedRuleNums[idx] = newRuleNumber;
                    }

                    return { ...item, rule_name: updatedRuleNames, rule_number: updatedRuleNums };
                });
                saveItems(newItems);
            };

            const createNewItem = () => {
                if (!itemsReady) {
                    showErrorToast('Create or open a valid items document before adding an item.');
                    setStatus('Save Blocked');
                    return;
                }
                const newId = crypto.randomUUID();
                const newItem = {
                    ...ITEM_TEMPLATE,
                    id_item: newId,
                    rule_name: [selectedRule !== '__all__' ? selectedRule : 'New'],
                    rule_number: [''],
                    subpart_name: [''],
                    subpart_number: [''],
                    id_subpart: [0],
                };
                saveItems([...items, newItem]);
                setSelectedItemId(newId);
                setView('inspector');
            };

            const createNewSource = () => {
                if (!sourcesReady) {
                    showErrorToast('Create or open a valid sources document before adding a source.');
                    setStatus('Save Blocked');
                    return;
                }
                const newId = crypto.randomUUID();
                const newSource = { ...SOURCE_TEMPLATE, id_source: newId, short_cite: "New Source" };
                saveSources([...sources, newSource]);
                setSelectedSourceId(newId);
                setView('sources');
            };

            // E014: Clone / Duplicate Item
            const cloneItem = (sourceItem) => {
                const newId = crypto.randomUUID();
                // Deep-copy all fields, including arrays, then stamp a fresh id
                const cloned = JSON.parse(JSON.stringify(sourceItem));
                cloned.id_item = newId;
                saveItems([...items, cloned]);
                setSelectedItemId(newId);
                setView('inspector');
                setStatus('Item cloned');
                // Scroll inspector to top after clone
                setTimeout(() => {
                    const container = document.getElementById('inspector-scroll-container');
                    if (container) container.scrollTop = 0;
                }, 0);
            };

            // Save As handlers
            const saveItemsAs = async () => {
                setStatus('Save As...');
                try {
                    await flushPendingDocumentSaves('items');
                    const document = itemsDocumentRef.current;
                    const res = await api('save_items_as', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: denormalizeItems(itemsRef.current, schemaModeRef.current),
                            document_token: document.token,
                            revision: document.revision,
                        })
                    });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        setItemsFilename(json.filename);
                        applyDocumentState('items', json.document);
                        // Save As keeps the same logical content and its valid history.
                        itemsHistoryDocumentToken.current = json.document.token;
                        setItemsReady(true);
                        setLoadError(null);
                        setStatus('Saved As ' + json.filename);
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    } else if (json.status === 'gui_unavailable') {
                        showErrorToast('File picker unavailable (tkinter not installed)');
                        setStatus('Error');
                    }
                } catch (e) { setStatus('Save Error'); showErrorToast(e.message || 'Save As failed'); }
            };

            const saveSourcesAs = async () => {
                setStatus('Save As...');
                try {
                    await flushPendingDocumentSaves('sources');
                    const document = sourcesDocumentRef.current;
                    const res = await api('save_sources_as', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: sourcesRef.current,
                            document_token: document.token,
                            revision: document.revision,
                        })
                    });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        setSourcesFilename(json.filename);
                        applyDocumentState('sources', json.document);
                        sourcesHistoryDocumentToken.current = json.document.token;
                        setSourcesReady(true);
                        setLoadError(null);
                        setStatus('Saved As ' + json.filename);
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    } else if (json.status === 'gui_unavailable') {
                        showErrorToast('File picker unavailable (tkinter not installed)');
                        setStatus('Error');
                    }
                } catch (e) { setStatus('Save Error'); showErrorToast(e.message || 'Save As failed'); }
            };

            // --- RENDER HELPERS ---

            const renderField = (obj, key, onChange, isSource = false) => {
                const safeValue = obj[key] === undefined || obj[key] === null ? '' : obj[key];
                const fieldId = `${isSource ? 'source' : 'item'}-field-${key}`;

                // Handle Arrays (like rule_number)
                if (Array.isArray(safeValue)) {
                    return (
                        <div key={key} className="col-span-12 md:col-span-6">
                            <label htmlFor={fieldId} className="custom-label flex justify-between">
                                {key.replace(/_/g, ' ')} <span className="text-xs opacity-50">LIST (comma sep)</span>
                            </label>
                            <input
                                id={fieldId}
                                className="custom-input"
                                value={safeValue.join(', ')}
                                onChange={(e) => onChange(key, e.target.value.split(',').map(s => s.trim()))}
                            />
                        </div>
                    );
                }

                const isLong = TEXTAREA_FIELDS.includes(key);

                return (
                    <div key={key} className={`col-span-12 ${isLong ? '' : 'md:col-span-6'}`}>
                        <label htmlFor={fieldId} className="custom-label">{key.replace(/_/g, ' ')}</label>
                        {isLong ? (
                            <textarea
                                id={fieldId}
                                className="custom-input min-h-[80px] font-serif"
                                value={safeValue}
                                onChange={(e) => onChange(key, e.target.value)}
                            />
                        ) : (
                            <input
                                id={fieldId}
                                className="custom-input"
                                value={safeValue}
                                onChange={(e) => onChange(key, e.target.value)}
                            />
                        )}
                    </div>
                );
            };

            // --- SIDEBAR RESIZE HANDLER ---
            const handleMouseDown = useCallback((e) => {
                isResizing.current = true;
                e.preventDefault();
                const startX = e.clientX;
                const startWidth = sidebarWidth;

                const onMouseMove = (e) => {
                    if (!isResizing.current) return;
                    const newWidth = Math.max(200, Math.min(600, startWidth + (e.clientX - startX)));
                    setSidebarWidth(newWidth);
                };
                const onMouseUp = () => {
                    isResizing.current = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                };
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [sidebarWidth]);

            // --- STAGE RESIZE HANDLER ---
            const handleStageMouseDown = useCallback((e) => {
                isStageResizing.current = true;
                e.preventDefault();
                const startX = e.clientX;
                const startWidth = stageWidth;

                const onMouseMove = (e) => {
                    if (!isStageResizing.current) return;
                    const newWidth = Math.max(200, Math.min(600, startWidth + (e.clientX - startX)));
                    setStageWidth(newWidth);
                };
                const onMouseUp = () => {
                    isStageResizing.current = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                };
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [stageWidth]);

            const handlePanelResizeKeyDown = useCallback((event, setWidth) => {
                let updateWidth = null;
                switch (event.key) {
                    case 'ArrowLeft':
                        updateWidth = current => Math.max(200, current - 20);
                        break;
                    case 'ArrowRight':
                        updateWidth = current => Math.min(600, current + 20);
                        break;
                    case 'Home':
                        updateWidth = () => 200;
                        break;
                    case 'End':
                        updateWidth = () => 600;
                        break;
                    default:
                        return;
                }
                event.preventDefault();
                setWidth(updateWidth);
            }, []);

            const getSupportChildren = (parentId) => items.filter(item => item.nested_under === parentId);

            const wouldCreateSupportCycle = (childId, parentId) => {
                let currentId = parentId;
                const visited = new Set();
                while (currentId && !visited.has(currentId)) {
                    if (currentId === childId) return true;
                    visited.add(currentId);
                    currentId = items.find(item => item.id_item === currentId)?.nested_under || '';
                }
                return false;
            };

            const nestItemUnder = (childId, parentId, surface) => {
                if (!childId || !parentId || childId === parentId) return;
                if (wouldCreateSupportCycle(childId, parentId)) {
                    showErrorToast('That support relationship would create a loop.');
                    return;
                }

                const parent = items.find(item => item.id_item === parentId);
                const child = items.find(item => item.id_item === childId);
                if (!parent || !child) return;

                let updatedChild = { ...child, nested_under: parentId };
                if (surface === 'draft') {
                    // Preserve the recovered Draft behavior: supporting items leave the
                    // top-level script order and return to the sidebar when un-nested.
                    updatedChild.id_script = 0;
                } else if (surface === 'stage' && stageRule) {
                    // A supporting Stage item belongs to the same staged rule/subpart as
                    // its parent so the relationship remains visible in that Stage.
                    const parentRuleIdx = Array.isArray(parent.rule_name) ? parent.rule_name.indexOf(stageRule) : -1;
                    const targetSubpart = parentRuleIdx >= 0 && Array.isArray(parent.subpart_name)
                        ? (parent.subpart_name[parentRuleIdx] || '')
                        : (stageSubpart === '__all_rule__' ? '' : (stageSubpart || ''));
                    const ruleNames = Array.isArray(child.rule_name) ? [...child.rule_name] : [];
                    const subpartNames = Array.isArray(child.subpart_name) ? [...child.subpart_name] : [];
                    const idSubparts = Array.isArray(child.id_subpart) ? [...child.id_subpart] : [];
                    let childRuleIdx = ruleNames.indexOf(stageRule);
                    if (childRuleIdx === -1) {
                        ruleNames.push(stageRule);
                        subpartNames.push(targetSubpart);
                        idSubparts.push(0);
                        childRuleIdx = ruleNames.length - 1;
                    } else {
                        while (subpartNames.length <= childRuleIdx) subpartNames.push('');
                        while (idSubparts.length <= childRuleIdx) idSubparts.push(0);
                        subpartNames[childRuleIdx] = targetSubpart;
                    }
                    const maxOrder = items.reduce((max, item) => {
                        if (!Array.isArray(item.rule_name)) return max;
                        const idx = item.rule_name.indexOf(stageRule);
                        if (idx === -1) return max;
                        const itemSubpart = Array.isArray(item.subpart_name) ? (item.subpart_name[idx] || '') : '';
                        if (itemSubpart !== targetSubpart) return max;
                        return Math.max(max, Array.isArray(item.id_subpart) ? (item.id_subpart[idx] || 0) : 0);
                    }, 0);
                    idSubparts[childRuleIdx] = maxOrder + 1;
                    updatedChild = {
                        ...updatedChild,
                        rule_name: ruleNames,
                        subpart_name: subpartNames,
                        id_subpart: idSubparts,
                    };
                }

                saveItems(items.map(item => item.id_item === childId ? updatedChild : item));
                setSupportTarget(null);
            };

            const unnestItem = (itemId) => {
                saveItems(items.map(item => item.id_item === itemId ? { ...item, nested_under: '' } : item));
            };

            // --- STAGE ITEMS (for pinned stageRule/stageSubpart, sorted by id_subpart) ---
            const stageItems = useMemo(() => {
                if (!stageRule) return [];
                return items
                    .filter(item => {
                        if (item.nested_under) return false;
                        if (!Array.isArray(item.rule_name)) return false;
                        if (!item.rule_name.includes(stageRule)) return false;
                        // Subpart filtering within the rule
                        if (stageSubpart === '__all_rule__') return true; // show all
                        const ruleIdx = item.rule_name.indexOf(stageRule);
                        const itemSubpart = Array.isArray(item.subpart_name) ? (item.subpart_name[ruleIdx] || '') : '';
                        if (stageSubpart === null) return !itemSubpart; // general only (no subpart)
                        return itemSubpart === stageSubpart; // specific subpart
                    })
                    .map(item => {
                        const ruleIdx = item.rule_name.indexOf(stageRule);
                        const subpartOrder = Array.isArray(item.id_subpart) ? (item.id_subpart[ruleIdx] || 0) : 0;
                        return { ...item, _stageOrder: subpartOrder, _ruleIdx: ruleIdx };
                    })
                    .sort((a, b) => a._stageOrder - b._stageOrder);
            }, [items, stageRule, stageSubpart]);

            // Auto-open Stage in Draft/Render modes
            useEffect(() => {
                if (view === 'draft' || view === 'render') {
                    setStageOpen(true);
                }
            }, [view]);

            // Reorder stage items via drag-and-drop
            const reorderStageItems = (fromIdx, toIdx) => {
                if (fromIdx === toIdx) return;
                const reordered = [...stageItems];
                const [moved] = reordered.splice(fromIdx, 1);
                reordered.splice(toIdx, 0, moved);

                // Build a map of item id -> new id_subpart value for this rule
                const updates = new Map();
                reordered.forEach((item, i) => {
                    updates.set(item.id_item, { ruleIdx: item._ruleIdx, newOrder: i + 1 });
                });

                // Apply to items array
                const newItems = items.map(item => {
                    const upd = updates.get(item.id_item);
                    if (!upd) return item;
                    const newSubparts = Array.isArray(item.id_subpart) ? [...item.id_subpart] : [];
                    // Ensure array is long enough
                    while (newSubparts.length <= upd.ruleIdx) newSubparts.push(0);
                    newSubparts[upd.ruleIdx] = upd.newOrder;
                    return { ...item, id_subpart: newSubparts };
                });
                saveItems(newItems);
            };

            // Assign an item to a rule (+ optional subpart) via drag-and-drop
            // insertAtPosition: if provided, insert at this position (1-indexed). Otherwise append to end.
            const assignItemToRule = (itemId, ruleName, subpartName = '', insertAtPosition = null) => {
                const item = items.find(i => i.id_item === itemId);
                if (!item) return;

                const ruleNames = Array.isArray(item.rule_name) ? [...item.rule_name] : [];
                const subpartNames = Array.isArray(item.subpart_name) ? [...item.subpart_name] : [];
                const idSubparts = Array.isArray(item.id_subpart) ? [...item.id_subpart] : [];

                // Check if already assigned to this rule
                const existingIdx = ruleNames.indexOf(ruleName);
                if (existingIdx !== -1) {
                    // Already has this rule — update subpart if different
                    if (subpartNames[existingIdx] === (subpartName || '')) return; // exact match, skip
                    subpartNames[existingIdx] = subpartName || '';
                } else {
                    // New rule assignment — append to parallel arrays
                    ruleNames.push(ruleName);
                    subpartNames.push(subpartName || '');
                    idSubparts.push(0); // will be set below
                }

                const ruleIdx = ruleNames.indexOf(ruleName);

                // Determine order value
                if (insertAtPosition !== null) {
                    // Insert at specific position — reorder all items in this rule+subpart context
                    idSubparts[ruleIdx] = insertAtPosition;
                } else {
                    // Append to end: find max id_subpart for this rule among all items
                    const maxOrder = items.reduce((max, it) => {
                        if (!Array.isArray(it.rule_name)) return max;
                        const idx = it.rule_name.indexOf(ruleName);
                        if (idx === -1) return max;
                        const order = Array.isArray(it.id_subpart) ? (it.id_subpart[idx] || 0) : 0;
                        return Math.max(max, order);
                    }, 0);
                    idSubparts[ruleIdx] = maxOrder + 1;
                }

                const updatedItem = { ...item, rule_name: ruleNames, subpart_name: subpartNames, id_subpart: idSubparts };
                saveItems(items.map(i => i.id_item === itemId ? updatedItem : i));
            };

            return (

                                    </div>
                                    <div>

                                        <p id="delete-dialog-description" className="text-sm text-slate-400 mt-1">{deleteConfirm.message}</p>
                                        {deleteConfirm.detail && (
                                            <p className="text-xs text-slate-500 mt-2">{deleteConfirm.detail}</p>

                                    </div>
                                </div>
                                <div className="p-5">
                                    <label htmlFor="suppress-delete-confirm" className="flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200 cursor-pointer mb-5">
                                        <input

                                            type="checkbox"

                                    const handleStageAllClick = (e) => {

                                    return (

                                                ? 'bg-indigo-900/50 text-indigo-200 border border-indigo-500/30'

                                                <button onClick={handleNameClick} className="flex-1 text-left flex items-center gap-2 min-w-0"
                                                    onDragOver={(e) => { if (e.dataTransfer.types.includes('text/plain')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; e.currentTarget.parentElement.classList.add('ring-2', 'ring-purple-400'); } }}
                                                    onDragLeave={(e) => { e.currentTarget.parentElement.classList.remove('ring-2', 'ring-purple-400'); }}
                                                    onDrop={(e) => { e.preventDefault(); e.currentTarget.parentElement.classList.remove('ring-2', 'ring-purple-400'); const itemId = e.dataTransfer.getData('text/plain'); if (itemId) assignItemToRule(itemId, rule.name, ''); }}
                                                >
                                                    {sidebarEditMode ? (

                                                            <input

                                                        {/* E014: Clone Item */}
                                                        <button onClick={() => {
                                                            const currentItem = items.find(i => i.id_item === selectedItemId);
                                                            if (currentItem) cloneItem(currentItem);
                                                        }} className="bg-teal-900/30 border border-teal-700 text-teal-400 hover:bg-teal-800/50 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 transition-colors"><Icon name="copy" size={14} /> CLONE</button>
                                                        <button onClick={() => {
                                                            const itemId = selectedItemId;
                                                            requestDeleteConfirmation({
                                                                title: 'Delete item?',
                                                                message: 'This item will be removed from the library.',
                                                                detail: 'You can restore it immediately from the undo toast or with Ctrl+Z.',
                                                                confirmLabel: 'Delete Item',
                                                                onConfirm: () => {
                                                                    const prev = [...items];
                                                                    saveItems(items.filter(i => i.id_item !== itemId));
                                                                    showDeleteToast('Item deleted', 'items', prev);
                                                                    setView('library');
                                                                },
                                                            });
                                                        }} className="bg-red-900/30 border border-red-700 text-red-400 hover:bg-red-800/50 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 transition-colors"><Icon name="trash-2" size={14} /> DELETE ITEM</button>
                                                    </div>
                                                </div>

                                                {(() => {
                                                    const currentItem = items.find(i => i.id_item === selectedItemId);
                                                    const autoResize = (el) => {
                                                        if (!el) return;
                                                        el.style.height = '0';
                                                        el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.33) + 'px';
                                                        el.style.overflowY = el.scrollHeight > window.innerHeight * 0.33 ? 'auto' : 'hidden';
                                                    };
                                                    return (
                                                        <div className="relative">
                                                            <div style={{ position: 'relative' }}>
                                                                <textarea
                                                                    id="quote-textarea"
                                                                    className="custom-input text-lg font-serif bg-slate-950"
                                                                    style={{ resize: 'none', overflow: 'hidden' }}
                                                                    rows={1}
                                                                    value={currentItem.quote_original || ''}
                                                                    onChange={(e) => {
                                                                        handleItemChange('quote_original', e.target.value);
                                                                        autoResize(e.target);
                                                                    }}
                                                                    onMouseUp={(e) => {
                                                                        const ta = e.target;
                                                                        const selText = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
                                                                        if (selText.length > 0) {
                                                                            const slots = [currentItem.example, currentItem.example_02, currentItem.example_03];
                                                                            const nextSlot = slots.findIndex(s => !s);
                                                                            if (nextSlot === -1) {
                                                                                setFloatingBtn(null);
                                                                                return;
                                                                            }
                                                                            const rect = ta.getBoundingClientRect();
                                                                            setFloatingBtn({
                                                                                text: selText,
                                                                                slot: nextSlot,
                                                                                top: e.clientY - rect.top - 30,
                                                                                right: 8
                                                                            });
                                                                        } else {
                                                                            setFloatingBtn(null);
                                                                        }
                                                                    }}
                                                                    onBlur={() => {
                                                                        setTimeout(() => setFloatingBtn(null), 200);
                                                                    }}
                                                                    ref={(el) => { if (el) autoResize(el); }}
                                                                />
                                                                {floatingBtn && (
                                                                    <button
                                                                        className="float-example-btn"
                                                                        style={{ top: floatingBtn.top, right: floatingBtn.right }}
                                                                        onMouseDown={(e) => {
                                                                            e.preventDefault();
                                                                            const fieldKey = EXAMPLE_FIELDS[floatingBtn.slot];
                                                                            // Atomic update: set both example text and flag in one save to avoid race condition
                                                                            const updatedItems = items.map(i =>
                                                                                i.id_item === selectedItemId
                                                                                    ? { ...i, [fieldKey]: floatingBtn.text, contains_example: true }
                                                                                    : i
                                                                            );
                                                                            saveItems(updatedItems);
                                                                            setFloatingBtn(null);
                                                                        }}
                                                                    >
                                                                        + {labels.exampleSlot || 'Ex'} {floatingBtn.slot + 1}
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })()}
                                            </div>

                                            {/* --- 2. LINKED SOURCE --- */}
                                            <div className="col-span-12 bg-slate-900 border border-slate-800 rounded-lg p-6 relative">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                                                <div className="flex justify-between items-center mb-4">
                                                    <h2 className="text-lg font-light text-white flex items-center gap-2">
                                                        <Icon name="link" className="text-emerald-500" />
                                                        Linked Source
                                                    </h2>
                                                    <SourcePicker key={currentItem.id_item}
                                                        sources={sources} selectedId={currentItem.id_source}
                                                        onSelect={id => handleItemChange('id_source', id)} />
                                                </div>
                                                {(() => {
                                                    const linkedSource = getSourceForItem(currentItem);
                                                    return linkedSource ? (
                                                        <div className="bg-slate-950/50 p-4 rounded border border-slate-800/50 text-sm text-slate-400 grid grid-cols-2 gap-4">
                                                            <div>
                                                                <span className="block text-xs uppercase text-slate-600 font-bold">Title</span>
                                                                <span className="text-slate-200">{linkedSource.title}</span>
                                                            </div>
                                                            <div>
                                                                <span className="block text-xs uppercase text-slate-600 font-bold">Author</span>
                                                                <span className="text-slate-200">{linkedSource.author}</span>
                                                            </div>
                                                            {linkedSource.url && (
                                                                <div className="col-span-2">
                                                                    <span className="block text-xs uppercase text-slate-600 font-bold">URL</span>
                                                                    <a href={linkedSource.url} target="_blank" rel="noreferrer"
                                                                       className="text-emerald-400 hover:text-emerald-300 text-xs break-all transition-colors">
                                                                        {linkedSource.url}
                                                                    </a>
                                                                </div>
                                                            )}
                                                            <div className="col-span-2">
                                                                <span className="block text-xs uppercase text-slate-600 font-bold">Details</span>
                                                                <span className="text-slate-200">{linkedSource.additional_source_details}</span>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="text-center p-8 text-slate-600 border border-dashed border-slate-800 rounded">
                                                            No source linked. Select one above.
                                                        </div>
                                                    );
                                                })()}
                                            </div>

                                            {/* --- 3. APPLIED RULES --- */}
                                            <RuleManager
                                                item={items.find(i => i.id_item === selectedItemId)}
                                                ruleHierarchy={ruleHierarchy}
                                                allItems={items}
                                                labels={labels}
                                                onSave={(newItem) => saveItems(items.map(i => i.id_item === newItem.id_item ? newItem : i))}
                                            />

                                            {/* --- 4. EXAMPLES --- */}
                                            <ExampleManager
                                                item={items.find(i => i.id_item === selectedItemId)}
                                                labels={labels}
                                                onSave={(newItem) => saveItems(itemsRef.current.map(i => i.id_item === newItem.id_item ? newItem : i))}
                                                onLocalChange={(newItem, timer) => stageItemEdit(itemsRef.current.map(i => i.id_item === newItem.id_item ? newItem : i), timer)}
                                                noteSaveTimer={exampleNoteSaveTimer}
                                            />

                                            <ReportMetadata report={items.find(i => i.id_item === selectedItemId)?.report_provenance} />

                                            {/* --- 5. ADDITIONAL INFORMATION (collapsible) --- */}
                                            <AdditionalInfoManager
                                                item={items.find(i => i.id_item === selectedItemId)}
                                                onChange={handleItemChange}
                                            />

                                            {/* --- NAV BAR (BOTTOM) --- */}
                                            <NavBar />

                                        </div>
                                    );
                                })() : (
                                    <div className="flex h-full items-center justify-center text-slate-500">Select an item</div>
                                )}
                            </div>
                        )}

                        {/* VIEW: DRAFT */}
                        {view === 'draft' && (() => {
                            // Compute draft items and script parts
                            const draftItems = items
                                .filter(d => (d.id_script || 0) > 0)
                                .filter(d => !d.nested_under)
                                .filter(d => selectedScriptPart === '__all__' || d.script_part === selectedScriptPart)
                                .sort((a, b) => (a.id_script || 0) - (b.id_script || 0));
                            const availableScriptParts = [...new Set(items.filter(d => (d.id_script || 0) > 0 && d.script_part).map(d => d.script_part))].sort();


                            const addToFinalScript = (id) => {
                                const maxScript = items.reduce((max, item) =>
                                    ((item.id_script || 0) > max ? (item.id_script || 0) : max), 0);
                                const updatedItems = items.map(i => i.id_item === id ? { ...i, id_script: maxScript + 1 } : i);
                                saveItems(updatedItems);
                            };

                            const removeFromFinalScript = (id) => {
                                const updatedItems = items.map(i => i.id_item === id ? { ...i, id_script: 0 } : i);
                                saveItems(updatedItems);
                            };

                            return (
                                <div className="flex-1 overflow-y-auto bg-slate-950 p-6">
                                    <div className="max-w-4xl mx-auto">
                                        <div className="text-center mb-8 pb-4 border-b border-slate-800">
                                            <div className="flex items-center justify-center gap-4 mb-2">
                                                <h1 className="text-2xl font-bold text-slate-100 flex items-center gap-2">
                                                    <Icon name="file-text" className="text-green-500" /> Script Draft
                                                </h1>
                                                <select
                                                    value={selectedScriptPart}
                                                    onChange={(e) => setSelectedScriptPart(e.target.value)}
                                                    className="bg-slate-800 border border-slate-700 text-slate-100 text-sm font-bold rounded px-2 py-1 focus:outline-none focus:border-green-500 cursor-pointer"
                                                >
                                                    <option value="__all__">All Topics</option>
                                                    {availableScriptParts.map(part => (
                                                        <option key={part} value={part}>{part}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <p className="text-slate-500 text-sm">
                                                {draftItems.length} items{selectedScriptPart !== '__all__' ? ` in ${selectedScriptPart}` : ' in draft'}
                                                {' '}• Set id_script on items in the Inspector to add them here
                                            </p>
                                            <div className="mt-4">
                                                <button
                                                    ref={draftProjectButtonRef}
                                                    type="button"
                                                    onClick={beginProjectExtraction}
                                                    disabled={!itemsReady || !sourcesReady}
                                                    className="card-action"
                                                >Create project from Draft</button>
                                                <p className="text-sm text-slate-300 mt-2">Copy all Draft cards and their supporting cards into a new project, with an empty Draft for a fresh story order.</p>
                                            </div>
                                        </div>

                                        {draftItems.length === 0 && (
                                            <div className="p-12 text-center border-2 border-dashed border-slate-800 rounded-lg">
                                                <Icon name="file-plus" className="mx-auto mb-3 text-slate-600" size={32} />
                                                <p className="text-slate-500">No items in draft yet.</p>
                                                <p className="text-slate-600 text-sm mt-1">Set id_script {'>'} 0 in the Inspector to add items to the script</p>
                                            </div>
                                        )}

                                        {draftItems.map((item, i) => (
                                            <div
                                                key={item.id_item}
