                                                data-testid={`draft-card-${item.id_item}`}
                                                draggable
                                                onDragStart={(event) => {
                                                    event.dataTransfer.setData('text/plain', item.id_item);
                                                    event.dataTransfer.effectAllowed = 'move';
                                                }}
                                                onDragOver={(event) => {
                                                    if (supportTarget?.surface === 'draft' && supportTarget.parentId === item.id_item) {
                                                        event.preventDefault();
                                                        event.dataTransfer.dropEffect = 'move';
                                                    }
                                                }}
                                                onDrop={(event) => {
                                                    if (supportTarget?.surface !== 'draft' || supportTarget.parentId !== item.id_item) return;
                                                    event.preventDefault();
                                                    event.stopPropagation();
                                                    nestItemUnder(event.dataTransfer.getData('text/plain'), item.id_item, 'draft');
                                                }}
                                                className={`mb-4 p-4 rounded-lg border bg-slate-900 group cursor-grab active:cursor-grabbing ${
                                                    supportTarget?.surface === 'draft' && supportTarget.parentId === item.id_item
                                                        ? 'border-amber-500 ring-1 ring-amber-500/50 bg-amber-950/20'
                                                        : 'border-slate-800 hover:border-slate-700'
                                                }`}
                                            >
                                                <div className="flex flex-wrap items-start gap-2 mb-3">
                                                    <div className="flex flex-wrap items-center gap-2 min-w-0">
                                                        <span className="text-xs font-mono text-green-400 font-bold">#{item.id_script}</span>
                                                        {item.script_part && <span className="text-xs bg-green-900/50 px-1.5 py-0.5 rounded text-green-400 uppercase">{item.script_part}</span>}
                                                        {(item.rule_name || []).map((r, ri) => (
                                                            <span key={ri} className="text-xs bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">{r}</span>
                                                        ))}
                                                    </div>
                                                    <div className="card-actions">
                                                        <button
                                                            type="button"
                                                            aria-label={`Edit ${item.quote_original || item.id_item}`}
                                                            onClick={(event) => {
                                                                event.stopPropagation();
                                                                setSelectedItemId(item.id_item);
                                                                setView('inspector');
                                                            }}
                                                            className="card-action"
                                                            title="Edit in Inspector"
                                                        >
                                                            <CardActionIcon name="edit" />
                                                        </button>
                                                        <button
                                                            type="button"
                                                            aria-label={`Support ${item.quote_original || item.id_item} in Draft`}
                                                            aria-pressed={supportTarget?.surface === 'draft' && supportTarget.parentId === item.id_item}
                                                            onClick={(event) => {
                                                                event.stopPropagation();
                                                                setSupportTarget(current => current?.surface === 'draft' && current.parentId === item.id_item
                                                                    ? null
                                                                    : { surface: 'draft', parentId: item.id_item });
                                                            }}
                                                            className="card-action"
                                                            title="Support: click, then drag an item onto this card"
                                                        >
                                                            <CardActionIcon name="support" />
                                                        </button>
                                                        <button
                                                            type="button"
                                                            aria-label={`Remove ${item.quote_original || item.id_item} from Draft`}
                                                            onClick={(event) => {
                                                                event.stopPropagation();
                                                                removeFromFinalScript(item.id_item);
                                                            }}
                                                            className="card-action"
                                                            title="Remove from Draft"
                                                        >
                                                            Remove
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Editable user_02_comments (script notes equivalent) */}
                                                <textarea
                                                    className="text-base leading-relaxed font-serif text-slate-100 bg-transparent w-full resize-none border-none focus:outline-none focus:ring-1 focus:ring-green-500 rounded p-1 overflow-hidden mb-2"
                                                    value={item.user_02_comments || ''}
                                                    onChange={(e) => {
                                                        const val = e.target.value;
                                                        stageItemEdit(itemsRef.current.map(it => it.id_item === item.id_item ? { ...it, user_02_comments: val } : it), draftSaveTimer);
                                                        autoResizeTextarea(e);
                                                    }}
                                                    onFocus={(e) => autoResizeTextarea(e)}
                                                    onInput={(e) => autoResizeTextarea(e)}
                                                    placeholder="Write your script notes here..."
                                                    style={{ minHeight: '2rem' }}
                                                />

                                                {/* Reference quote */}
                                                <div className="pl-3 border-l-2 border-slate-700 text-xs text-slate-500">
                                                    <span className="text-slate-600">Quote: </span>{item.quote_original || 'No quote'}
                                                </div>

                                                {item.short_cite && (
                                                    <div className="mt-2 text-xs text-slate-600 font-mono">— {item.short_cite}</div>
                                                )}

                                                {getSupportChildren(item.id_item).length > 0 && (
                                                    <div className="mt-3 pt-3 border-t border-amber-900/40 space-y-2">
                                                        <div className="text-xs font-bold text-amber-400 flex items-center gap-1">
                                                            <Icon name="git-branch" size={12} />
                                                            {getSupportChildren(item.id_item).length} supporting item{getSupportChildren(item.id_item).length === 1 ? '' : 's'}
                                                        </div>
                                                        {getSupportChildren(item.id_item).map(child => (
                                                            <div
                                                                key={child.id_item}
                                                                data-testid={`draft-support-${child.id_item}`}
                                                                className="ml-4 bg-slate-950/70 border border-amber-900/40 rounded p-3 flex items-start gap-3"
                                                            >
                                                                <div className="flex-1 min-w-0">
                                                                    <p className="text-sm text-slate-300 leading-relaxed">
                                                                        {child.quote_original || child.user_01_comments || child.id_item}
                                                                    </p>
                                                                    {child.short_cite && (
                                                                        <p className="text-xs text-slate-600 mt-1 font-mono">— {child.short_cite}</p>
                                                                    )}
                                                                </div>
                                                                <button
                                                                    type="button"
                                                                    aria-label={`Remove ${child.quote_original || child.id_item} from support group`}
                                                                    onClick={(event) => {
                                                                        event.stopPropagation();
                                                                        unnestItem(child.id_item);
                                                                    }}
                                                                    className="card-action"
                                                                    title="Un-nest item"
                                                                >
                                                                    Un-nest
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })()}

                        {/* VIEW: RENDER */}
                        {view === 'render' && (() => {
                            const renderItems = items
                                .filter(d => (d.id_script || 0) > 0)
                                .filter(d => selectedScriptPart === '__all__' || d.script_part === selectedScriptPart)
                                .sort((a, b) => (a.id_script || 0) - (b.id_script || 0));
                            const availableScriptParts = [...new Set(items.filter(d => (d.id_script || 0) > 0 && d.script_part).map(d => d.script_part))].sort();


                            // --- EXPORT: build script text with auto-footnotes ---
                            const buildExportText = (format) => {
                                const md = format === 'md';
                                // 1. Collect unique sources, assign sequential footnote numbers
                                const sourceMap = new Map();
                                let sourceNum = 0;
                                renderItems.forEach(item => {
                                    const sid = item.id_source;
                                    if (sid && !sourceMap.has(sid)) {
                                        sourceNum++;
                                        const src = sourceById.get(sid);
                                        sourceMap.set(sid, { number: sourceNum, source: src, cite: item.short_cite || sid });
                                    }
                                });

                                // 2. Build segment lines with inline [N] refs
                                const lines = [];
                                const title = selectedScriptPart !== '__all__' ? selectedScriptPart : 'Script';
                                lines.push(md ? `# ${title}` : title.toUpperCase());
                                lines.push('');
                                lines.push(`${renderItems.length} Segments • Generated ${new Date().toLocaleDateString()}`);
                                lines.push('');
                                lines.push(md ? '---' : '────────────────────────────────────');
                                lines.push('');

                                let currentPart = null;
                                renderItems.forEach((item, i) => {
                                    const part = item.script_part || (item.rule_name || [])[0] || 'SEGMENT ' + (i + 1);
                                    if (part !== currentPart) {
                                        if (currentPart !== null) lines.push('');
                                        lines.push(md ? `## ${part}` : `[${part.toUpperCase()}]`);
                                        lines.push('');
                                        currentPart = part;
                                    }
                                    const text = (item.user_02_comments || '').trim();
                                    if (!text) return;
                                    const ref = item.id_source && sourceMap.has(item.id_source)
                                        ? ` [${sourceMap.get(item.id_source).number}]`
                                        : '';
                                    lines.push(text + ref);
                                    lines.push('');
                                });

                                // 3. Footnotes section
                                if (sourceMap.size > 0) {
                                    lines.push(md ? '---' : '────────────────────────────────────');
                                    lines.push('');
                                    lines.push(md ? '## Sources' : 'SOURCES');
                                    lines.push('');
                                    sourceMap.forEach(({ number, source, cite }) => {
                                        if (source) {
                                            const parts = [];
                                            if (source.author) parts.push(source.author);
                                            if (source.title) parts.push(`"${source.title}"`);
                                            if (source.publication) parts.push(source.publication);
                                            if (source.date_published) parts.push(source.date_published);
                                            if (source.page) parts.push('p. ' + source.page);
                                            const citeLine = parts.length > 0 ? parts.join(', ') : cite;
                                            const url = source.url || source.archive_url || '';
                                            lines.push(`[${number}] ${citeLine}`);
                                            if (url) lines.push(`    ${url}`);
                                        } else {
                                            lines.push(`[${number}] ${cite}`);
                                        }
                                    });
                                }
                                return lines.join('\n');
                            };

                            const copyToClipboard = async () => {
                                const text = buildExportText('plain');
                                try {
                                    await navigator.clipboard.writeText(text);
                                    setStatus('Copied ' + renderItems.length + ' segments to clipboard');
                                } catch (e) {
                                    showErrorToast('Failed to copy — browser may have blocked clipboard access');
                                }
                            };

                            const downloadMarkdown = () => {
                                const text = buildExportText('md');
                                const partLabel = selectedScriptPart !== '__all__' ? selectedScriptPart.replace(/\s+/g, '_') : 'script';
                                const filename = partLabel + '_' + new Date().toISOString().slice(0, 10) + '.md';
                                const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = filename;
                                a.click();
                                URL.revokeObjectURL(url);
                                setStatus('Downloaded ' + filename);
                            };

                            return (
                                <div className="flex-1 overflow-y-auto bg-slate-900 text-slate-200 p-12">
                                    <div className="max-w-3xl mx-auto">
                                        <div className="text-center mb-12 border-b border-slate-700 pb-8">
                                            <div className="flex items-center justify-center gap-4 mb-2">
                                                <button
                                                    onClick={() => setHideFactsInRender(!hideFactsInRender)}
                                                    className={`p-2 rounded transition-colors ${hideFactsInRender ? 'bg-amber-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                                    title={hideFactsInRender ? 'Quotes hidden — click to show' : 'Click to hide quotes'}
                                                >
                                                    <Icon name={hideFactsInRender ? 'eye-off' : 'eye'} size={18} />
                                                </button>
                                                <h1 className="text-4xl font-serif font-bold text-slate-100">Script Render</h1>
                                                <select
                                                    value={selectedScriptPart}
                                                    onChange={(e) => setSelectedScriptPart(e.target.value)}
                                                    className="bg-slate-800 border border-slate-700 text-slate-100 text-sm font-bold rounded px-2 py-1 focus:outline-none focus:border-amber-500 cursor-pointer"
                                                >
                                                    <option value="__all__">All Topics</option>
                                                    {availableScriptParts.map(part => (
                                                        <option key={part} value={part}>{part}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <p className="text-slate-400 font-mono text-sm">
                                                {renderItems.length} Segments{selectedScriptPart !== '__all__' ? ` in ${selectedScriptPart}` : ''}
                                                {' '}• Generated {new Date().toLocaleDateString()}
                                            </p>
                                            {/* Export buttons */}
                                            <div className="flex items-center justify-center gap-2 mt-4">
                                                <button
                                                    onClick={copyToClipboard}
                                                    disabled={renderItems.length === 0}
                                                    className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-white px-3 py-1.5 rounded border border-slate-700 hover:bg-slate-800 hover:border-slate-600 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                                                    title="Copy script with footnotes to clipboard"
                                                >
                                                    <Icon name="clipboard-copy" size={14} /> Copy with Sources
                                                </button>
                                                <button
                                                    onClick={downloadMarkdown}
                                                    disabled={renderItems.length === 0}
                                                    className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-white px-3 py-1.5 rounded border border-slate-700 hover:bg-slate-800 hover:border-slate-600 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                                                    title="Download as markdown file with footnotes"
                                                >
                                                    <Icon name="file-down" size={14} /> Export .md
                                                </button>
                                            </div>
                                        </div>

                                        {renderItems.map((item, i) => (
                                            <div key={item.id_item} className="mb-10 group">
                                                <div className="flex items-baseline gap-3 mb-2 opacity-40 group-hover:opacity-100 transition-opacity">
                                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-widest">
                                                        {item.script_part || (item.rule_name || [])[0] || 'SEGMENT ' + (i + 1)}
                                                    </span>
                                                    <span className="text-xs font-mono text-slate-600">#{item.id_script}</span>
                                                </div>

                                                {/* Main content: user_02_comments (editable, auto-expanding) */}
                                                <textarea
                                                    className="text-xl leading-relaxed font-serif text-slate-100 bg-transparent w-full resize-none border-none focus:outline-none focus:ring-1 focus:ring-amber-500 rounded p-1 overflow-hidden"
                                                    value={item.user_02_comments || ''}
                                                    onChange={(e) => {
                                                        const val = e.target.value;
                                                        stageItemEdit(itemsRef.current.map(it => it.id_item === item.id_item ? { ...it, user_02_comments: val } : it), draftSaveTimer);
                                                        autoResizeTextarea(e);
                                                    }}
                                                    onFocus={(e) => autoResizeTextarea(e)}
                                                    onInput={(e) => autoResizeTextarea(e)}
                                                    placeholder=""
                                                    style={{ minHeight: '2.5rem' }}
                                                />

                                                {/* Reference quote below */}
                                                {!hideFactsInRender && item.quote_original && (
                                                    <div className="mt-4 ml-4 pl-4 border-l-2 border-slate-700 text-xs font-sans text-slate-400">
                                                        <span className="text-slate-500">Quote: </span>{item.quote_original}
                                                        {item.short_cite && (
                                                            <span className="ml-2 text-slate-600">— {item.short_cite}</span>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })()}

                        {/* VIEW: SOURCES MANAGER */}
                        {/* VIEW: PARSER */}
                        {view === 'parser' && (
                            <div className="flex-1 overflow-y-auto p-6">
                                <div className="max-w-5xl mx-auto">
                                    <h2 className="text-xl text-white font-light mb-6 flex items-center gap-2">
                                        <Icon name="file-text" className="text-orange-500" /> DRR Report Import
                                    </h2>

                                    {/* File/Folder picker buttons */}
                                    <div className="flex gap-3 mb-6">
                                        <button
                                            disabled={parseLoading}
                                            onClick={async () => {
                                                setParseLoading(true); setParseError(null); setParseResult(null);
                                                try {
                                                    const res = await api('parse_drr_picker', {
                                                        method: 'POST',
                                                        headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ mode: 'file' })
                                                    });
                                                    const data = await res.json();
                                                    if (data.status === 'success') setParseResult(data);
                                                    else if (data.status !== 'canceled') setParseError(data.message || 'Parse failed');
                                                } catch (e) { setParseError('Server unavailable'); }
                                                setParseLoading(false);
                                            }}
                                            className="flex items-center gap-2 bg-orange-600 hover:bg-orange-500 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-colors disabled:opacity-50"
                                        >
                                            <Icon name="file-plus" size={16} /> Select .mdx File
                                        </button>
                                        <button
                                            disabled={parseLoading}
                                            onClick={async () => {
                                                setParseLoading(true); setParseError(null); setParseResult(null);
                                                try {
                                                    const res = await api('parse_drr_picker', {
                                                        method: 'POST',
                                                        headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ mode: 'folder' })
                                                    });
                                                    const data = await res.json();
                                                    if (data.status === 'success') setParseResult(data);
                                                    else if (data.status !== 'canceled') setParseError(data.message || 'Parse failed');
                                                } catch (e) { setParseError('Server unavailable'); }
                                                setParseLoading(false);
                                            }}
                                            className="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-colors disabled:opacity-50"
                                        >
                                            <Icon name="folder-open" size={16} /> Select Folder (Bulk)
                                        </button>
                                        {parseLoading && <span className="text-orange-400 text-sm font-mono animate-pulse self-center">Parsing...</span>}
                                    </div>

                                    {parseError && (
                                        <div className="bg-red-900/30 border border-red-700 text-red-300 px-4 py-3 rounded-lg mb-6 text-sm">
                                            <Icon name="alert-circle" size={14} className="inline mr-2" />{parseError}
                                        </div>
                                    )}

                                    {parseResult && (() => {
                                        const stats = parseResult.stats || {};
                                        const totalItems = stats.total_items || stats.items || 0;
                                        const totalSources = stats.total_sources || stats.sources || 0;
                                        const files = parseResult.files || (parseResult.title ? [{ title: parseResult.title, stats: parseResult.stats }] : []);
                                        const parserCollisions = Array.isArray(parseResult.collisions) ? parseResult.collisions : [];
                                        const importReview = getDrrImportReview(parseResult, [...items, ...sources]);
                                        return (
                                            <>
                                                {/* Stats bar */}
                                                <div className="flex items-center gap-4 mb-6 bg-slate-900 border border-slate-800 rounded-lg px-5 py-3">
                                                    <div className="flex items-center gap-2">
                                                        <Icon name="file-text" size={14} className="text-orange-400" />
                                                        <span className="text-sm font-bold text-white">{files.length} report{files.length !== 1 ? 's' : ''}</span>
                                                    </div>
                                                    <span className="text-slate-700">|</span>
                                                    <div className="flex items-center gap-2">
                                                        <Icon name="list" size={14} className="text-indigo-400" />
                                                        <span className="text-sm text-slate-300">{totalItems} items</span>
                                                    </div>
                                                    <span className="text-slate-700">|</span>
                                                    <div className="flex items-center gap-2">
                                                        <Icon name="database" size={14} className="text-emerald-400" />
                                                        <span className="text-sm text-slate-300">{totalSources} sources</span>
                                                    </div>
                                                    <span className="text-slate-700">|</span>
                                                    <span className="text-xs text-slate-500 font-mono truncate flex-1">{parseResult.selected_path || parseResult.filepath || ''}</span>
                                                    <div className="flex items-center gap-2 shrink-0">
                                                        <button
                                                            disabled={parseSaving || !importReview.canSave}
                                                            title={!importReview.canSave ? 'Resolve the report errors below before saving' : ''}
                                                            onClick={async () => {
                                                                const documentTokens = [itemsDocumentRef.current?.token, sourcesDocumentRef.current?.token];
                                                                setParseSaving(true);
                                                                setParseError(null);
                                                                try {
                                                                    await flushAllPendingDocumentSaves();
                                                                    if (documentTokens[0] !== itemsDocumentRef.current?.token || documentTokens[1] !== sourcesDocumentRef.current?.token) {
                                                                        throw new Error('Active documents changed while saving pending edits. Review the import again.');
                                                                    }
                                                                    const r = await api('save_import_document', {
                                                                        method: 'POST',
                                                                        headers: { 'Content-Type': 'application/json' },
                                                                        body: JSON.stringify({
                                                                            can_import: parseResult.can_import,
                                                                            diagnostics: parseResult.diagnostics,
                                                                            items: parseResult.items,
                                                                            sources: parseResult.sources,
                                                                            selected_path: parseResult.selected_path || parseResult.filepath,
                                                                            items_document: itemsDocumentRef.current,
                                                                            sources_document: sourcesDocumentRef.current,
                                                                        })
                                                                    });
                                                                    const d = await readApiResponse(r);
                                                                    // Reload — apply full normalization same as initial fetchData
                                                                    const reload = await api('data');
                                                                    const fresh = await readApiResponse(reload);
                                                                    const freshRaw = fresh.items || [];
                                                                    const freshMode = detectSchemaMode(freshRaw);
                                                                    activateItemsDocument({
                                                                        rawItems: freshRaw,
                                                                        filename: d.items_filename,
                                                                        document: fresh.items_document,
                                                                        mode: freshMode,
                                                                    });
                                                                    activateSourcesDocument({
                                                                        sources: fresh.sources || [],
                                                                        filename: d.sources_filename,
                                                                        document: fresh.sources_document,
                                                                    });
                                                                    setParseResult(null);
                                                                    setStatus(`Saved ${d.items_filename} and ${d.sources_filename}`);
                                                                } catch (e) {
                                                                    setParseError('Save failed: ' + e.message);
                                                                } finally {
                                                                    setParseSaving(false);
                                                                }
                                                            }}
                                                            className="bg-orange-600 hover:bg-orange-500 text-white px-4 py-1.5 rounded font-bold text-xs flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            <Icon name="file-plus" size={14} /> {parseSaving ? 'Saving...' : 'Save to New File'}
                                                        </button>
                                                        <button
                                                            disabled={parseSaving || !importReview.canAppend}
                                                            title={!importReview.canAppend ? 'Review the import messages below' : ''}
                                                            onClick={async () => {
                                                                const documentTokens = [itemsDocumentRef.current?.token, sourcesDocumentRef.current?.token];
                                                                setParseSaving(true);
                                                                setParseError(null);
                                                                setStatus('Appending import...');
                                                                try {
                                                                    await flushAllPendingDocumentSaves();
                                                                    if (documentTokens[0] !== itemsDocumentRef.current?.token || documentTokens[1] !== sourcesDocumentRef.current?.token) {
                                                                        throw new Error('Active documents changed while saving pending edits. Review the import again.');
                                                                    }
                                                                    const importedSources = parseResult.sources || [];
                                                                    const existingSourcesById = new Map(sourcesRef.current.map(source => [source.id_source, source]));
                                                                    const importedSourcesById = new Map();
                                                                    const collisionIds = new Set();
                                                                    const sourceRecordsMatch = (first, second) => {
                                                                        const keys = new Set([...Object.keys(first || {}), ...Object.keys(second || {})]);
                                                                        return [...keys].every(key => JSON.stringify(first?.[key] ?? null) === JSON.stringify(second?.[key] ?? null));
                                                                    };

                                                                    importedSources.forEach(source => {
                                                                        const sourceId = source.id_source;
                                                                        if (!sourceId) return;
                                                                        if (importedSourcesById.has(sourceId)) collisionIds.add(sourceId);
                                                                        else importedSourcesById.set(sourceId, source);
                                                                        const existingSource = existingSourcesById.get(sourceId);
                                                                        if (existingSource && !sourceRecordsMatch(existingSource, source)) {
                                                                            collisionIds.add(sourceId);
                                                                        }
                                                                    });

                                                                    if (collisionIds.size > 0) {
                                                                        const ids = [...collisionIds].sort();
                                                                        setParseError(`Append stopped: source ID collision${ids.length === 1 ? '' : 's'}: ${ids.slice(0, 5).join(', ')}${ids.length > 5 ? ` (+${ids.length - 5} more)` : ''}`);
                                                                        setStatus('Append Error');
                                                                        return;
                                                                    }

                                                                    const importedItems = normalizeItems(parseResult.items, 'research');
                                                                    const newItems = [...itemsRef.current, ...importedItems];
                                                                    const existingSourceIds = new Set(sourcesRef.current.map(s => s.id_source));
                                                                    const newSources = [...sourcesRef.current, ...importedSources.filter(s => !existingSourceIds.has(s.id_source))];
                                                                    const response = await api('append_import', {
                                                                        method: 'POST',
                                                                        headers: { 'Content-Type': 'application/json' },
                                                                        body: JSON.stringify({
                                                                            items: denormalizeItems(newItems, schemaModeRef.current),
                                                                            sources: newSources,
                                                                            imported_sources: importedSources,
                                                                            can_import: parseResult.can_import,
                                                                            diagnostics: parseResult.diagnostics,
                                                                            items_document: itemsDocumentRef.current,
                                                                            sources_document: sourcesDocumentRef.current,
                                                                        }),
                                                                    });
                                                                    const saved = await readApiResponse(response);
                                                                    applyDocumentState('items', saved.items_document);
                                                                    applyDocumentState('sources', saved.sources_document);
                                                                    undoStack.current.push([...itemsRef.current]);
                                                                    if (undoStack.current.length > UNDO_LIMIT) undoStack.current.shift();
                                                                    redoStack.current = [];
                                                                    setItems(newItems);
                                                                    setSources(newSources);
                                                                    setParseResult(null);
                                                                    setView('library');
                                                                    setStatus('Appended to current file');
                                                                } catch (error) {
                                                                    setParseError(`Append failed: ${error.message || 'Unable to save the import'}`);
                                                                    setStatus('Append Error');
                                                                } finally {
                                                                    setParseSaving(false);
                                                                }
                                                            }}
                                                            className="bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded font-bold text-xs flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            <Icon name="download" size={14} /> {parseSaving ? 'Appending...' : 'Append to Current'}
                                                        </button>
                                                    </div>
                                                </div>

                                                <DrrImportReview result={parseResult} review={importReview} />

                                                {parserCollisions.length > 0 && (
                                                    <div role="alert" className="bg-red-900/30 border border-red-700 text-red-200 px-4 py-3 rounded-lg mb-6 text-sm">
                                                        <div className="font-bold mb-1">
                                                            <Icon name="alert-triangle" size={14} className="inline mr-2" />
                                                            Source ID collision{parserCollisions.length === 1 ? '' : 's'} detected — saving is disabled
                                                        </div>
                                                        {parserCollisions.slice(0, 5).map((collision, index) => (
                                                            <div key={`${collision.id_source || 'collision'}-${index}`} className="text-xs font-mono text-red-300 mt-1">
                                                                {collision.message || collision.id_source}
                                                            </div>
                                                        ))}
                                                        {parserCollisions.length > 5 && (
                                                            <div className="text-xs text-red-300 mt-1">+{parserCollisions.length - 5} more collision{parserCollisions.length - 5 === 1 ? '' : 's'}</div>
                                                        )}
                                                    </div>
                                                )}

                                                {/* Per-file breakdown (if folder) */}
                                                {files.length > 1 && (
                                                    <div className="mb-6 space-y-1">
                                                        {files.map((f, i) => (
                                                            <div key={i} className="flex items-center gap-3 bg-slate-900/50 border border-slate-800/50 rounded px-3 py-2 text-xs">
                                                                <Icon name="file-text" size={12} className="text-orange-400/60 shrink-0" />
                                                                <span className="text-slate-300 flex-1 truncate">{f.title || f.filename}</span>
                                                                <span className="text-slate-500 font-mono shrink-0">{f.stats.items} items</span>
                                                                <span className="text-slate-600 font-mono shrink-0">{f.stats.sources} src</span>
                                                                <span className="text-slate-600 font-mono shrink-0">{f.stats.sections} sec</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Preview cards */}
                                                <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">Preview ({Math.min(parseResult.items.length, 50)} of {totalItems})</h3>
                                                <div className="space-y-2">
                                                    {parseResult.items.slice(0, 50).map((item, i) => (
                                                        <div key={i} className="bg-slate-900 border border-slate-800 rounded-lg p-4 group hover:border-orange-500/30 transition-colors">
                                                            <div className="flex items-start justify-between gap-3 mb-2">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    {(item.category_part_name || []).map((cat, ci) => (
                                                                        <span key={ci} className="text-xs bg-indigo-900/40 text-indigo-300 px-1.5 py-0.5 rounded font-bold">{cat}</span>
                                                                    ))}
                                                                    {(item.subpart_name || []).filter(s => s).map((sub, si) => (
                                                                        <span key={si} className="text-xs bg-purple-900/40 text-purple-300 px-1.5 py-0.5 rounded">{sub}</span>
                                                                    ))}
                                                                </div>
                                                                <span className="text-xs text-slate-600 font-mono shrink-0">#{i + 1}</span>
                                                            </div>
                                                            <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">{item.quote_original}</p>
                                                            <div className="flex items-center gap-3 mt-2">
                                                                {item.short_cite && <span className="text-xs text-emerald-500 font-mono truncate">{item.short_cite}</span>}
                                                                {(item.related_facts || []).length > 0 && <span className="text-xs text-amber-500/60">multi-cite group</span>}
                                                            </div>
                                                        </div>
                                                    ))}
                                                    {parseResult.items.length > 50 && (
                                                        <div className="text-center text-slate-600 text-xs py-4">...and {parseResult.items.length - 50} more items</div>
                                                    )}
                                                </div>
                                            </>
                                        );
                                    })()}

                                    {!parseResult && !parseLoading && !parseError && (
                                        <div className="text-center py-20 text-slate-600">
                                            <Icon name="file-text" size={48} className="mx-auto mb-4 text-slate-700" />
                                            <p className="text-lg font-light mb-2">Import DRR Reports</p>
                                            <p className="text-sm">Select a single <strong>.mdx</strong> file or a folder to bulk-parse all reports.</p>
                                            <p className="text-xs mt-2 text-slate-700">Parsed items will be previewed before importing into your library.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'sources' && (
                            <div className="flex-1 overflow-y-auto p-6">
                                <div className="max-w-5xl mx-auto">
                                    <h2 className="text-xl text-white font-light mb-6 flex items-center gap-2">
                                        <Icon name="database" className="text-emerald-500" /> Source Database
                                    </h2>

                                    <div className="space-y-4">
                                        {sources.map(source => (
                                            <div
                                                key={source.id_source}
                                                ref={source.id_source === selectedSourceId ? (el) => { if (el) { setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); setTimeout(() => setSelectedSourceId(null), 2000); } } : null}
                                                className={`bg-slate-900 border rounded-lg p-4 transition-colors ${source.id_source === selectedSourceId ? 'border-emerald-500 ring-1 ring-emerald-500/50' : 'border-slate-800'}`}
                                            >
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h3 className="text-emerald-400 font-bold font-mono">{source.short_cite}</h3>
                                                        <p className="text-xs text-slate-500">{source.id_source}</p>
                                                    </div>
                                                    <button onClick={() => {
                                                        requestDeleteConfirmation({
                                                            title: 'Delete source?',
                                                            message: 'This source will be removed from the source database.',
                                                            detail: 'Items that reference it will lose their visible linked-source details. You can restore it immediately from the undo toast.',
                                                            confirmLabel: 'Delete Source',
                                                            onConfirm: () => {
                                                                const prev = [...sources];
                                                                saveSources(sources.filter(s => s.id_source !== source.id_source));
                                                                showDeleteToast('Source deleted', 'sources', prev);
                                                            },
                                                        });
                                                    }} className="bg-red-900/30 border border-red-700 text-red-400 hover:bg-red-800/50 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 transition-colors"><Icon name="trash-2" size={14} /> DELETE</button>
                                                </div>

                                                <div className="grid grid-cols-12 gap-4">
                                                    <ReportMetadata report={source.report_provenance} />
                                                    {Object.keys(SOURCE_TEMPLATE).map(key => {
                                                        if (['id_source'].includes(key)) return null;
                                                        return renderField(source, key, (k, v) => handleSourceChange(source.id_source, k, v), true);
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                            </div> {/* end views container */}
                        </div> {/* end content area (stage + views) */}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
