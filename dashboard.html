        const AdditionalInfoManager = ({ item, onChange }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [addingField, setAddingField] = useState(false);

            // Discover extra fields not handled by any known UI section
            const extraFields = useMemo(() => {
                return Object.keys(item).filter(k => !RENDERED_ELSEWHERE.has(k));
            }, [item]);

            // All fields this section is responsible for: known + extra
            const allFields = useMemo(() => {
                const combined = [...ADDITIONAL_INFO_FIELDS];
                extraFields.forEach(k => { if (!combined.includes(k)) combined.push(k); });
                return combined;
            }, [extraFields]);

            const extraFieldSet = useMemo(() => new Set(extraFields), [extraFields]);

            // Which fields currently have data?
            const fieldsWithData = allFields.filter(k => {
                const v = item[k];
                return v !== undefined && v !== null && v !== '' && v !== 0;
            });

            // Track manually shown fields (for adding empty ones)
            const [shownFields, setShownFields] = useState(new Set());

            const visibleFields = allFields.filter(k =>
                fieldsWithData.includes(k) || shownFields.has(k)
            );

            const hiddenFields = allFields.filter(k => !visibleFields.includes(k));

            const addField = (key) => {
                setShownFields(prev => new Set([...prev, key]));
                setAddingField(false);
            };

            const totalVisible = visibleFields.length;
            const extraCount = visibleFields.filter(k => extraFieldSet.has(k)).length;

            return (
                <div className="col-span-12 bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex justify-between items-center p-4 hover:bg-slate-800/30 transition-colors"
                    >
                        <label className="custom-label text-slate-400 mb-0 flex items-center gap-2 cursor-pointer">
                            <Icon name="info" size={14} className="text-slate-500" />
                            Additional Information
                            {totalVisible > 0 && (
                                <span className="text-[10px] bg-slate-800 text-slate-500 px-1.5 py-0.5 rounded font-mono">
                                    {totalVisible} field{totalVisible !== 1 ? 's' : ''}
                                </span>
                            )}
                            {extraCount > 0 && (
                                <span className="text-[10px] bg-amber-900/30 text-amber-400 px-1.5 py-0.5 rounded font-mono">
                                    {extraCount} extra
                                </span>
                            )}
                        </label>
                        <Icon name={isOpen ? 'chevron-up' : 'chevron-down'} size={16} className="text-slate-500" />
                    </button>

                    {isOpen && (
                        <div className="px-4 pb-4">
                            <div className="grid grid-cols-12 gap-4">
                                {visibleFields.map(key => {
                                    const safeValue = item[key] === undefined || item[key] === null ? '' : item[key];
                                    const isExtra = extraFieldSet.has(key);
                                    const isLong = TEXTAREA_FIELDS.includes(key) || (typeof safeValue === 'string' && safeValue.length > 100);
                                    return (
                                        <div key={key} className={`col-span-12 ${isLong ? '' : 'md:col-span-6'}`}>
                                            <label className="custom-label flex items-center gap-1">
                                                {key.replace(/_/g, ' ')}
                                                {isExtra && <span className="text-[8px] bg-amber-900/40 text-amber-400 px-1 py-0.5 rounded font-bold ml-1">EXTRA</span>}
                                            </label>
                                            {isLong ? (
                                                <textarea
                                                    className="custom-input min-h-[60px] font-serif"
                                                    value={typeof safeValue === 'object' ? JSON.stringify(safeValue) : safeValue}
                                                    onChange={(e) => onChange(key, e.target.value)}
                                                />
                                            ) : (
                                                <input
                                                    className="custom-input"
                                                    value={typeof safeValue === 'object' ? JSON.stringify(safeValue) : safeValue}
                                                    onChange={(e) => onChange(key, e.target.value)}
                                                />
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {hiddenFields.length > 0 && (
                                <div className="mt-3 flex items-center gap-2">
                                    {addingField ? (
                                        <select
                                            className="bg-slate-950 border border-slate-700 text-slate-300 text-xs rounded px-2 py-1"
                                            autoFocus
                                            value=""
                                            onChange={(e) => { if (e.target.value) addField(e.target.value); }}
                                            onBlur={() => setAddingField(false)}
                                        >
                                            <option value="">-- Add a field --</option>
                                            {hiddenFields.map(k => (
                                                <option key={k} value={k}>{k.replace(/_/g, ' ')}{extraFieldSet.has(k) ? ' (extra)' : ''}</option>
                                            ))}
                                        </select>
                                    ) : (
                                        <button
                                            onClick={() => setAddingField(true)}
                                            className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1 rounded font-bold border border-slate-700 flex items-center gap-1"
                                        >
                                            <Icon name="plus" size={12} /> Add Field
                                        </button>
                                    )}
                                </div>
                            )}

                            {visibleFields.length === 0 && !addingField && (
                                <div className="text-center py-4 text-slate-600 text-xs">
                                    No additional fields set. Click "Add Field" to add one.
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            // Data States
            const [items, setItems] = useState([]);
            const [sources, setSources] = useState([]);
            const sourceById = useMemo(() => {
                const map = new Map();
                sources.forEach(source => {
                    // Match Array.find semantics if malformed data contains duplicate IDs.
                    if (!map.has(source.id_source)) map.set(source.id_source, source);
                });
                return map;
            }, [sources]);

            // UI States
            const [view, setView] = useState('library'); // library, sources, inspector
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [selectedSourceId, setSelectedSourceId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [status, setStatus] = useState('Ready');
            const [loadError, setLoadError] = useState(null);
            const [itemsReady, setItemsReady] = useState(false);
            const [sourcesReady, setSourcesReady] = useState(false);
            const [selectedRule, setSelectedRule] = useState('__all__');
            const [selectedSubpart, setSelectedSubpart] = useState(null); // null = show general (no-subpart) items; string = specific subpart

            // Conditional schema mode (research vs improv)
            const [schemaMode, setSchemaMode] = useState('improv');
            const schemaModeRef = useRef(schemaMode);
            schemaModeRef.current = schemaMode;
            const labels = SCHEMA_LABELS[schemaMode];
            // Expose labels to child components (RuleRow/RuleManager are defined outside App)
            window.__schemaLabels = labels;
            const [stageRule, setStageRule] = useState(null); // rule pinned in Stage
            const [stageSubpart, setStageSubpart] = useState(null); // null = general only, '__all_rule__' = all, string = specific subpart
            const [sidebarEditMode, setSidebarEditMode] = useState(false);
            const [expandedRules, setExpandedRules] = useState(new Set());
            const [floatingBtn, setFloatingBtn] = useState(null);
            const [showCreateMenu, setShowCreateMenu] = useState(false);
            const [showSaveMenu, setShowSaveMenu] = useState(false);
            const [newDocModal, setNewDocModal] = useState(false);
            const [sidebarWidth, setSidebarWidth] = useState(300);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const sidebarWidthBeforeCollapse = useRef(300);

            // Stage panel
            const [stageOpen, setStageOpen] = useState(false);
            const [stageWidth, setStageWidth] = useState(320);
            const isStageResizing = useRef(false);
            const stageDragIdx = useRef(null);
            const [stageDragOverIdx, setStageDragOverIdx] = useState(null);

            // E013: Bulk selection
            const [bulkSelectedIds, setBulkSelectedIds] = useState(new Set());
            const lastBulkClickIdx = useRef(null);

            // E009: Error toast
            const [errorToast, setErrorToast] = useState(null);
            const errorToastTimer = useRef(null);
            const showErrorToast = useCallback((msg) => {
                setErrorToast(msg);
                if (errorToastTimer.current) clearTimeout(errorToastTimer.current);
                errorToastTimer.current = setTimeout(() => setErrorToast(null), 6000);
            }, []);

            // E016: Undo/Redo stacks
            const undoStack = useRef([]);
            const redoStack = useRef([]);
            const UNDO_LIMIT = 30;

            // E016: Delete undo toast (supports items + sources)
            const [deleteToast, setDeleteToast] = useState(null); // { message, restoreType, previousData }
            const deleteToastTimer = useRef(null);
            const showDeleteToast = (msg, restoreType, prevData) => {
                setDeleteToast({ message: msg, restoreType, previousData: prevData });
                if (deleteToastTimer.current) clearTimeout(deleteToastTimer.current);
                deleteToastTimer.current = setTimeout(() => setDeleteToast(null), 6000);
            };

            // E016: Suppressible delete confirmation
            const [suppressDeleteConfirm, setSuppressDeleteConfirm] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null); // { title, message, detail, confirmLabel, onConfirm }
            const requestDeleteConfirmation = ({ title, message, detail, confirmLabel = 'Delete', onConfirm }) => {
                if (suppressDeleteConfirm) {
                    onConfirm();
                    return;
                }
                setDeleteConfirm({ title, message, detail, confirmLabel, onConfirm });
            };

            // E015: Quick-filter chips
            const [activeFilters, setActiveFilters] = useState(new Set());
            const QUICK_FILTERS = [
                { key: 'hasExamples', label: `Has ${labels.examplesTitle || 'Examples'}`, icon: 'lightbulb', color: 'amber' },
                { key: 'noSource', label: 'No Source', icon: 'unlink', color: 'red' },
                { key: 'inDraft', label: 'In Draft', icon: 'list', color: 'green' },
                { key: 'notInDraft', label: 'Not In Draft', icon: 'list-x', color: 'slate' },
                { key: 'hasComments', label: 'Has Comments', icon: 'message-square', color: 'blue' },
                { key: 'notCategorized', label: 'Not Categorized', icon: 'inbox', color: 'purple' },
            ];
            const toggleFilter = (key) => {
                const next = new Set(activeFilters);
                // Mutually exclusive: inDraft / notInDraft
                if (key === 'inDraft' && next.has('notInDraft')) next.delete('notInDraft');
                if (key === 'notInDraft' && next.has('inDraft')) next.delete('inDraft');
                if (next.has(key)) next.delete(key);
                else next.add(key);
                setActiveFilters(next);
            };

            // E006: Searchable field selection (labels adapt to schema mode)
            const SEARCH_FIELDS = useMemo(() => [
                { key: 'quote_original', label: 'Quote' },
                { key: 'example', label: 'Example 1' },
                { key: 'example_02', label: 'Example 2' },
                { key: 'example_03', label: 'Example 3' },
                { key: 'user_01_comments', label: labels.user_01 },
                { key: 'user_02_comments', label: labels.user_02 },
                { key: 'short_cite', label: 'Citation' },
                { key: 'rule_name', label: `${labels.rule} Name` },
                { key: 'subpart_name', label: 'Subpart Name' },
                { key: 'id_item', label: 'Item ID' },
            ], [labels]);
            const [searchFields, setSearchFields] = useState(() => new Set(SEARCH_FIELDS.map(f => f.key)));
            const [showSearchFields, setShowSearchFields] = useState(false);
            const searchFieldsRef = useRef(null);
            useEffect(() => {
                if (!showSearchFields) return;
                const handleOutsideClick = (e) => {
                    if (searchFieldsRef.current && !searchFieldsRef.current.contains(e.target)) {
                        setShowSearchFields(false);
                    }
                };
                document.addEventListener('mousedown', handleOutsideClick);
                return () => document.removeEventListener('mousedown', handleOutsideClick);
            }, [showSearchFields]);

            // Draft/Render state
            const [selectedScriptPart, setSelectedScriptPart] = useState('__all__');
            const [hideFactsInRender, setHideFactsInRender] = useState(false);
            const isResizing = useRef(false);
            const draftSaveTimer = useRef(null);
            const inspectorSaveTimer = useRef(null);
            const inspectorUndoSnapshot = useRef(null); // Captures pre-edit state for undo
            const sourceSaveTimer = useRef(null);

            // Serialize saves and coalesce intermediate snapshots while a request is active.
            // This prevents older requests from finishing after newer ones and overwriting them.
            const itemsSaveQueue = useRef({ inFlight: false, pending: null });
            const sourcesSaveQueue = useRef({ inFlight: false, pending: null });

            // DRR Parser state
            const [parseResult, setParseResult] = useState(null);
            const [parseLoading, setParseLoading] = useState(false);
            const [parseError, setParseError] = useState(null);

            // Source search combobox state
            const [srcQuery, setSrcQuery] = useState('');
            const [srcOpen, setSrcOpen] = useState(false);
            // QoL #5: Reset combobox when navigating between items
            useEffect(() => { setSrcQuery(''); setSrcOpen(false); }, [selectedItemId]);

            // File tracking
            const [itemsFilename, setItemsFilename] = useState('No file');
            const [sourcesFilename, setSourcesFilename] = useState('No file');

            const readApiResponse = async (response) => {
                let payload;
                try {
                    payload = await response.json();
                } catch (error) {
                    throw new Error(`Server returned an unreadable response (HTTP ${response.status}).`);
                }
                if (!response.ok || payload?.status === 'error') {
                    throw new Error(payload?.message || `Request failed with HTTP ${response.status}.`);
                }
                return payload;
            };

            const reportLoadError = (error) => {
                const message = error?.message || 'The document could not be loaded.';
                setLoadError(message);
                setStatus('Load Error');
                showErrorToast(message);
            };

            // --- FILE PICKER HANDLERS ---
            const openItemsPicker = async () => {
                setStatus('Opening file picker...');
                try {
                    const res = await api('open_items', { method: 'POST' });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        const rawPicked = json.data || [];
                        const pickedMode = detectSchemaMode(rawPicked);
                        setSchemaMode(pickedMode);
                        setItems(normalizeItems(rawPicked, pickedMode));
                        setItemsReady(true);
                        setItemsFilename(json.filename);
                        setLoadError(null);
                        setStatus(`Items loaded (${pickedMode})`);
                    } else if (json.status === 'gui_unavailable') {
                        const path = prompt('Tkinter unavailable. Enter full path to Items JSON file:');
                        if (path) {
                            const manualRes = await api('switch_items', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path })
                            });
                            const manualJson = await readApiResponse(manualRes);
                            if (manualJson.status === 'success') {
                                const rawManual = manualJson.data || [];
                                const manualMode = detectSchemaMode(rawManual);
                                setSchemaMode(manualMode);
                                setItems(normalizeItems(rawManual, manualMode));
                                setItemsReady(true);
                                setItemsFilename(manualJson.filename);
                                setLoadError(null);
                                setStatus(`Items loaded (${manualMode})`);
                            }
                        }
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    }
                } catch (e) {
                    reportLoadError(e);
                }
            };

            const openSourcesPicker = async () => {
                setStatus('Opening file picker...');
                try {
                    const res = await api('open_sources', { method: 'POST' });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        setSources(json.data || []);
                        setSourcesReady(true);
                        setSourcesFilename(json.filename);
                        setLoadError(null);
                        setStatus('Sources loaded');
                    } else if (json.status === 'gui_unavailable') {
                        const path = prompt('Tkinter unavailable. Enter full path to Sources JSON file:');
                        if (path) {
                            const manualRes = await api('switch_sources', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path })
                            });
                            const manualJson = await readApiResponse(manualRes);
                            if (manualJson.status === 'success') {
                                setSources(manualJson.data || []);
                                setSourcesReady(true);
                                setSourcesFilename(manualJson.filename);
                                setLoadError(null);
                                setStatus('Sources loaded');
                            }
                        }
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    }
                } catch (e) {
                    reportLoadError(e);
                }
            };

            // --- SERVER IO ---
            const fetchData = async () => {
                setStatus('Loading...');
                try {
                    const res = await api('data');
                    const json = await readApiResponse(res);
                    const rawItems = json.items || [];
                    const mode = detectSchemaMode(rawItems);
                    setSchemaMode(mode);
                    setItems(normalizeItems(rawItems, mode));
                    setSources(json.sources || []);
                    setItemsReady(true);
                    setSourcesReady(true);
                    setItemsFilename(json.items_filename || 'items.json');
                    setSourcesFilename(json.sources_filename || 'sources.json');
                    setLoadError(null);
                    setStatus(`Loaded (${mode})`);
                } catch (e) {
                    setItemsReady(false);
                    setSourcesReady(false);
                    reportLoadError(e);
                }
            };

            // Ref to always have current items for undo (avoids stale closure)
            const itemsRef = useRef(items);
            itemsRef.current = items;

            const enqueueSave = (queueRef, job) => {
                const queue = queueRef.current;
                queue.pending = job;
                setStatus(job.savingStatus);

                if (queue.inFlight) return;
                queue.inFlight = true;

                const drain = async () => {
                    let activeJob = null;
                    let finalStatus = job.successStatus;
                    try {
                        while (queue.pending) {
                            activeJob = queue.pending;
                            queue.pending = null;
                            const response = await api(activeJob.endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: activeJob.serialize()
                            });
                            if (!response.ok) {
                                throw new Error(`${activeJob.endpoint} failed with HTTP ${response.status}`);
                            }
                            finalStatus = activeJob.successStatus;
                        }
                        setStatus(finalStatus);
                    } catch (error) {
                        queue.pending = null;
                        setStatus('Save Error');
                        showErrorToast(activeJob?.errorMessage || 'Failed to save — server may be down');
                        console.error(error);
                    } finally {
                        queue.inFlight = false;
                    }
                };

                void drain();
            };

            const queueItemsSave = (newItems, successStatus = 'Saved') => {
                if (!itemsReady) {
                    showErrorToast('Items were not saved because no valid items document is loaded.');
                    setStatus('Save Blocked');
                    return false;
                }
                const mode = schemaModeRef.current;
                enqueueSave(itemsSaveQueue, {
                    endpoint: 'save_items',
                    serialize: () => JSON.stringify(denormalizeItems(newItems, mode)),
                    savingStatus: 'Saving Items...',
                    successStatus,
                    errorMessage: 'Failed to save items — server may be down'
                });
                return true;
            };

            const queueSourcesSave = (newSources, successStatus = 'Saved') => {
                if (!sourcesReady) {
                    showErrorToast('Sources were not saved because no valid sources document is loaded.');
                    setStatus('Save Blocked');
                    return false;
                }
                enqueueSave(sourcesSaveQueue, {
                    endpoint: 'save_sources',
                    serialize: () => JSON.stringify(newSources),
                    savingStatus: 'Saving Sources...',
                    successStatus,
                    errorMessage: 'Failed to save sources — server may be down'
                });
                return true;
            };

            const saveItems = (newItems) => {
                if (!itemsReady) {
                    showErrorToast('Create or open a valid items document before making changes.');
                    setStatus('Save Blocked');
                    return false;
                }
                // E016: Push current state to undo stack before saving
                undoStack.current.push([...itemsRef.current]);
                if (undoStack.current.length > UNDO_LIMIT) undoStack.current.shift();
                redoStack.current = []; // Clear redo on new action
                setItems(newItems);
                queueItemsSave(newItems);
                return true;
            };

            const saveSources = (newSources) => {
                if (!sourcesReady) {
                    showErrorToast('Create or open a valid sources document before making changes.');
                    setStatus('Save Blocked');
                    return false;
                }
                setSources(newSources);
                queueSourcesSave(newSources);
                return true;
            };

            useEffect(() => { fetchData(); }, []);

            // E008: Arrow key shortcuts for Prev/Next in inspector
            // E016: Ctrl+Z / Ctrl+Shift+Z undo/redo
            useEffect(() => {
                const handler = (e) => {
                    // E016: Ctrl+Z undo
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                        const tag = document.activeElement?.tagName?.toLowerCase();
                        if (tag === 'input' || tag === 'textarea') return; // Let browser handle text undo
                        e.preventDefault();
                        if (undoStack.current.length === 0) return;
                        const prev = undoStack.current.pop();
                        redoStack.current.push([...itemsRef.current]);
                        setItems(prev);
                        setStatus('Undone');
                        // Also save the restored state to server
                        queueItemsSave(prev, 'Saved (undo)');
                        return;
                    }
                    // E016: Ctrl+Shift+Z redo
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) {
                        const tag = document.activeElement?.tagName?.toLowerCase();
                        if (tag === 'input' || tag === 'textarea') return;
                        e.preventDefault();
                        if (redoStack.current.length === 0) return;
                        const next = redoStack.current.pop();
                        undoStack.current.push([...itemsRef.current]);
                        setItems(next);
                        setStatus('Redone');
                        queueItemsSave(next, 'Saved (redo)');
                        return;
                    }
                    // E008: Arrow keys for inspector
                    if (view !== 'inspector' || !selectedItemId) return;
                    const tag = document.activeElement?.tagName?.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        const idx = filteredItems.findIndex(i => i.id_item === selectedItemId);
                        if (idx === -1) return;
                        const next = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
                        if (next >= 0 && next < filteredItems.length) {
                            setSelectedItemId(filteredItems[next].id_item);
                            const container = document.getElementById('inspector-scroll-container');
                            if (container) container.scrollTop = 0;
                        }
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [view, selectedItemId, filteredItems, showErrorToast, itemsReady]);

            // --- COMPUTED DATA ---

            // Build hierarchical rule structure for sidebar
            const { ruleHierarchy, ruleByName } = useMemo(() => {
                const ruleMap = new Map(); // key: rule_name, value: { number, name, subparts: Map, itemCount, generalItemCount }

                items.forEach(item => {
                    const ruleNames = Array.isArray(item.rule_name) ? item.rule_name : [];
                    const ruleNums = Array.isArray(item.rule_number) ? item.rule_number : [];
                    const subpartNums = Array.isArray(item.subpart_number) ? item.subpart_number : [];
                    const subpartNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];

                    ruleNames.forEach((name, idx) => {
                        if (!name) return;
                        const num = ruleNums[idx] || '';
                        const subNum = subpartNums[idx] || '';
                        const subName = subpartNames[idx] || '';

                        if (!ruleMap.has(name)) {
                            ruleMap.set(name, { number: num, name: name, subparts: new Map(), itemCount: 0, generalItemCount: 0 });
                        }
                        const rule = ruleMap.get(name);
                        rule.itemCount++;
                        if (!rule.number && num) rule.number = num;

                        // Add subpart if exists, otherwise count as general
                        if (subNum || subName) {
                            const subKey = subNum || subName;
                            if (!rule.subparts.has(subKey)) {
                                rule.subparts.set(subKey, { number: subNum, name: subName, itemCount: 0 });
                            }
                            rule.subparts.get(subKey).itemCount++;
                        } else {
                            rule.generalItemCount++;
                        }
                    });
                });

                // Convert to array and sort: numbered rules first, then alphabetical
                const hierarchy = Array.from(ruleMap.values())
                    .map(r => ({ ...r, subparts: Array.from(r.subparts.values()).sort((a, b) => (a.number || a.name).localeCompare(b.number || b.name, undefined, { numeric: true, sensitivity: 'base' })) }))
                    .sort((a, b) => {
                        if (a.number && !b.number) return -1;
                        if (!a.number && b.number) return 1;
                        if (a.number && b.number) return a.number.localeCompare(b.number, undefined, { numeric: true, sensitivity: 'base' });
                        return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                    });

                return { ruleHierarchy: hierarchy, ruleByName: ruleMap };
            }, [items]);

            // Filtered Items for Main View + search match map (computed together to avoid setState during render)
            const { filteredItems, searchMatchMap } = useMemo(() => {
                let filtered = items;

                // 1. Filter by Rule
                if (selectedRule !== '__all__') {
                    filtered = filtered.filter(item => {
                        if (!Array.isArray(item.rule_name)) return false;
                        const rNames = item.rule_name;
                        const sNames = Array.isArray(item.subpart_name) ? item.subpart_name : [];

                        // Find indices where this rule appears
                        const matchingIndices = rNames.reduce((acc, rn, i) => {
                            if (rn === selectedRule) acc.push(i);
                            return acc;
                        }, []);

                        if (matchingIndices.length === 0) return false;

                        if (selectedSubpart === '__all_rule__') {
                            // All-rule view: show ALL items for this rule (general + all subparts)
                            return true;
                        } else if (selectedSubpart === null) {
                            // General view: show items where this rule has NO subpart (empty/missing)
                            return matchingIndices.some(i => !sNames[i]);
                        } else {
                            // Subpart view: show items where this rule has the matching subpart
                            return matchingIndices.some(i => sNames[i] === selectedSubpart);
                        }
                    });
                }

                // 2. E006: Filter by Search across selected fields
                const matchMap = new Map();
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(item => {
                        for (const f of SEARCH_FIELDS) {
                            if (!searchFields.has(f.key)) continue;
                            const val = item[f.key];
                            if (Array.isArray(val)) {
                                if (val.some(v => (v || '').toString().toLowerCase().includes(q))) {
                                    matchMap.set(item.id_item, f.label);
                                    return true;
                                }
                            } else if ((val || '').toString().toLowerCase().includes(q)) {
                                matchMap.set(item.id_item, f.label);
                                return true;
                            }
                        }
                        return false;
                    });
                }

                // 3. E015: Quick-filter chips
                if (activeFilters.size > 0) {
                    filtered = filtered.filter(item => {
                        if (activeFilters.has('hasExamples') && !item.contains_example) return false;
                        if (activeFilters.has('noSource') && item.id_source) return false;
                        if (activeFilters.has('inDraft') && !(item.id_script > 0)) return false;
                        if (activeFilters.has('notInDraft') && item.id_script > 0) return false;
                        if (activeFilters.has('hasComments') && !(item.user_01_comments && item.user_01_comments.trim())) return false;
                        if (activeFilters.has('notCategorized') && Array.isArray(item.rule_name) && item.rule_name.some(r => r)) return false;
                        return true;
                    });
                }

                return { filteredItems: filtered, searchMatchMap: matchMap };
            }, [items, selectedRule, selectedSubpart, searchQuery, searchFields, activeFilters]);

            // Helper to get Source info for an Item
            const getSourceForItem = (item) => {
                if (!item || !item.id_source) return null;
                return sourceById.get(item.id_source);
            };

            // --- EDITORS ---

            const handleItemChange = (field, value) => {
                if (!selectedItemId || !itemsReady) return;
                const newItems = items.map(i => i.id_item === selectedItemId ? { ...i, [field]: value } : i);
                // Capture pre-edit state for undo (only on first keystroke in debounce window)
                if (!inspectorSaveTimer.current) {
                    inspectorUndoSnapshot.current = [...itemsRef.current];
                }
                // Immediate local update for responsive UI
                setItems(newItems);
                // Debounced save to server + undo stack (600ms after last keystroke)
                if (inspectorSaveTimer.current) clearTimeout(inspectorSaveTimer.current);
                inspectorSaveTimer.current = setTimeout(() => {
                    // Push the pre-edit snapshot to undo stack
                    undoStack.current.push(inspectorUndoSnapshot.current);
                    if (undoStack.current.length > UNDO_LIMIT) undoStack.current.shift();
                    redoStack.current = [];
                    inspectorUndoSnapshot.current = null;
                    inspectorSaveTimer.current = null;
                    // Persist through the central queue (setItems already ran).
                    queueItemsSave(newItems);
                }, 600);
            };

            const handleSourceChange = (id, field, value) => {
                if (!sourcesReady) return;
                const newSources = sources.map(s => s.id_source === id ? { ...s, [field]: value } : s);
                // Immediate local update for responsive UI
                setSources(newSources);
                // Debounced save to server (600ms)
                if (sourceSaveTimer.current) clearTimeout(sourceSaveTimer.current);
                sourceSaveTimer.current = setTimeout(() => {
                    sourceSaveTimer.current = null;
                    queueSourcesSave(newSources);
                }, 600);
            };

            // Bulk update rule name/number for all items with a specific rule_name
            const updateRuleForAll = (oldRuleName, newRuleName, newRuleNumber) => {
                if (!itemsReady) return;
                const newItems = items.map(item => {
                    if (!Array.isArray(item.rule_name) || !item.rule_name.includes(oldRuleName)) return item;

                    const idx = item.rule_name.indexOf(oldRuleName);
                    const updatedRuleNames = [...item.rule_name];
                    const updatedRuleNums = Array.isArray(item.rule_number) ? [...item.rule_number] : [];

                    if (newRuleName !== null) updatedRuleNames[idx] = newRuleName;
                    if (newRuleNumber !== null) {
                        while (updatedRuleNums.length <= idx) updatedRuleNums.push('');
                        updatedRuleNums[idx] = newRuleNumber;
                    }

                    return { ...item, rule_name: updatedRuleNames, rule_number: updatedRuleNums };
                });
                // Immediate local update for responsive UI
                setItems(newItems);
                // Queue save on the closure-captured newItems — no debounce needed here
                // because the save queue already coalesces rapid requests, and reading
                // itemsRef.current inside a timer could race with concurrent Inspector edits.
                queueItemsSave(newItems);
            };

            const createNewItem = () => {
                if (!itemsReady) {
                    showErrorToast('Create or open a valid items document before adding an item.');
                    setStatus('Save Blocked');
                    return;
                }
                const newId = crypto.randomUUID();
                const newItem = {
                    ...ITEM_TEMPLATE,
                    id_item: newId,
                    rule_name: [selectedRule !== '__all__' ? selectedRule : 'New'],
                    rule_number: [''],
                    subpart_name: [''],
                    subpart_number: [''],
                    id_subpart: [0],
                };
                saveItems([...items, newItem]);
                setSelectedItemId(newId);
                setView('inspector');
            };

            const createNewSource = () => {
                if (!sourcesReady) {
                    showErrorToast('Create or open a valid sources document before adding a source.');
                    setStatus('Save Blocked');
                    return;
                }
                const newId = crypto.randomUUID();
                const newSource = { ...SOURCE_TEMPLATE, id_source: newId, short_cite: "New Source" };
                saveSources([...sources, newSource]);
                setSelectedSourceId(newId);
                setView('sources');
            };

            // E014: Clone / Duplicate Item
            const cloneItem = (sourceItem) => {
                const newId = crypto.randomUUID();
                // Deep-copy all fields, including arrays, then stamp a fresh id
                const cloned = JSON.parse(JSON.stringify(sourceItem));
                cloned.id_item = newId;
                saveItems([...items, cloned]);
                setSelectedItemId(newId);
                setView('inspector');
                setStatus('Item cloned');
                // Scroll inspector to top after clone
                setTimeout(() => {
                    const container = document.getElementById('inspector-scroll-container');
                    if (container) container.scrollTop = 0;
                }, 0);
            };

            // Save As handlers
            const saveItemsAs = async () => {
                setStatus('Save As...');
                try {
                    const res = await api('save_items_as', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: denormalizeItems(items, schemaMode) })
                    });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        setItemsFilename(json.filename);
                        setItemsReady(true);
                        setLoadError(null);
                        setStatus('Saved As ' + json.filename);
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    } else if (json.status === 'gui_unavailable') {
                        showErrorToast('File picker unavailable (tkinter not installed)');
                        setStatus('Error');
                    }
                } catch (e) { setStatus('Save Error'); showErrorToast(e.message || 'Save As failed'); }
            };

            const saveSourcesAs = async () => {
                setStatus('Save As...');
                try {
                    const res = await api('save_sources_as', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: sources })
                    });
                    const json = await readApiResponse(res);
                    if (json.status === 'success') {
                        setSourcesFilename(json.filename);
                        setSourcesReady(true);
                        setLoadError(null);
                        setStatus('Saved As ' + json.filename);
                    } else if (json.status === 'canceled') {
                        setStatus('Canceled');
                    } else if (json.status === 'gui_unavailable') {
                        showErrorToast('File picker unavailable (tkinter not installed)');
                        setStatus('Error');
                    }
                } catch (e) { setStatus('Save Error'); showErrorToast(e.message || 'Save As failed'); }
            };

            // --- RENDER HELPERS ---

            const renderField = (obj, key, onChange, isSource = false) => {
                const safeValue = obj[key] === undefined || obj[key] === null ? '' : obj[key];

                // Handle Arrays (like rule_number)
                if (Array.isArray(safeValue)) {
                    return (
                        <div key={key} className="col-span-12 md:col-span-6">
                            <label className="custom-label flex justify-between">
                                {key.replace(/_/g, ' ')} <span className="text-[10px] opacity-50">LIST (comma sep)</span>
                            </label>
                            <input
                                className="custom-input"
                                value={safeValue.join(', ')}
                                onChange={(e) => onChange(key, e.target.value.split(',').map(s => s.trim()))}
                            />
                        </div>
                    );
                }

                const isLong = TEXTAREA_FIELDS.includes(key);

                return (
                    <div key={key} className={`col-span-12 ${isLong ? '' : 'md:col-span-6'}`}>
                        <label className="custom-label">{key.replace(/_/g, ' ')}</label>
                        {isLong ? (
                            <textarea
                                className="custom-input min-h-[80px] font-serif"
                                value={safeValue}
                                onChange={(e) => onChange(key, e.target.value)}
                            />
                        ) : (
                            <input
                                className="custom-input"
                                value={safeValue}
                                onChange={(e) => onChange(key, e.target.value)}
                            />
                        )}
                    </div>
                );
            };

            // --- SIDEBAR RESIZE HANDLER ---
            const handleMouseDown = useCallback((e) => {
                isResizing.current = true;
                e.preventDefault();
                const startX = e.clientX;
                const startWidth = sidebarWidth;

                const onMouseMove = (e) => {
                    if (!isResizing.current) return;
                    const newWidth = Math.max(200, Math.min(600, startWidth + (e.clientX - startX)));
                    setSidebarWidth(newWidth);
                };
                const onMouseUp = () => {
                    isResizing.current = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                };
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [sidebarWidth]);

            // --- STAGE RESIZE HANDLER ---
            const handleStageMouseDown = useCallback((e) => {
                isStageResizing.current = true;
                e.preventDefault();
                const startX = e.clientX;
                const startWidth = stageWidth;

                const onMouseMove = (e) => {
                    if (!isStageResizing.current) return;
                    const newWidth = Math.max(200, Math.min(600, startWidth + (e.clientX - startX)));
                    setStageWidth(newWidth);
                };
                const onMouseUp = () => {
                    isStageResizing.current = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                };
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }, [stageWidth]);

            // --- STAGE ITEMS (for pinned stageRule/stageSubpart, sorted by id_subpart) ---
            const stageItems = useMemo(() => {
                if (!stageRule) return [];
                return items
                    .filter(item => {
                        if (!Array.isArray(item.rule_name)) return false;
                        if (!item.rule_name.includes(stageRule)) return false;
                        // Subpart filtering within the rule
                        if (stageSubpart === '__all_rule__') return true; // show all
                        const ruleIdx = item.rule_name.indexOf(stageRule);
                        const itemSubpart = Array.isArray(item.subpart_name) ? (item.subpart_name[ruleIdx] || '') : '';
                        if (stageSubpart === null) return !itemSubpart; // general only (no subpart)
                        return itemSubpart === stageSubpart; // specific subpart
                    })
                    .map(item => {
                        const ruleIdx = item.rule_name.indexOf(stageRule);
                        const subpartOrder = Array.isArray(item.id_subpart) ? (item.id_subpart[ruleIdx] || 0) : 0;
                        return { ...item, _stageOrder: subpartOrder, _ruleIdx: ruleIdx };
                    })
                    .sort((a, b) => a._stageOrder - b._stageOrder);
            }, [items, stageRule, stageSubpart]);

            // Auto-open Stage in Draft/Render modes
            useEffect(() => {
                if (view === 'draft' || view === 'render') {
                    setStageOpen(true);
                }
            }, [view]);

            // Reorder stage items via drag-and-drop
            const reorderStageItems = (fromIdx, toIdx) => {
                if (fromIdx === toIdx) return;
                const reordered = [...stageItems];
                const [moved] = reordered.splice(fromIdx, 1);
                reordered.splice(toIdx, 0, moved);

                // Build a map of item id -> new id_subpart value for this rule
                const updates = new Map();
                reordered.forEach((item, i) => {
                    updates.set(item.id_item, { ruleIdx: item._ruleIdx, newOrder: i + 1 });
                });

                // Apply to items array
                const newItems = items.map(item => {
                    const upd = updates.get(item.id_item);
                    if (!upd) return item;
                    const newSubparts = Array.isArray(item.id_subpart) ? [...item.id_subpart] : [];
                    // Ensure array is long enough
                    while (newSubparts.length <= upd.ruleIdx) newSubparts.push(0);
                    newSubparts[upd.ruleIdx] = upd.newOrder;
                    return { ...item, id_subpart: newSubparts };
                });
                saveItems(newItems);
            };

            // Assign an item to a rule (+ optional subpart) via drag-and-drop
            // insertAtPosition: if provided, insert at this position (1-indexed). Otherwise append to end.
            const assignItemToRule = (itemId, ruleName, subpartName = '', insertAtPosition = null) => {
                const item = items.find(i => i.id_item === itemId);
                if (!item) return;

                const ruleNames = Array.isArray(item.rule_name) ? [...item.rule_name] : [];
                const subpartNames = Array.isArray(item.subpart_name) ? [...item.subpart_name] : [];
                const idSubparts = Array.isArray(item.id_subpart) ? [...item.id_subpart] : [];

                // Check if already assigned to this rule
                const existingIdx = ruleNames.indexOf(ruleName);
                if (existingIdx !== -1) {
                    // Already has this rule — update subpart if different
                    if (subpartNames[existingIdx] === (subpartName || '')) return; // exact match, skip
                    subpartNames[existingIdx] = subpartName || '';
                } else {
                    // New rule assignment — append to parallel arrays
                    ruleNames.push(ruleName);
                    subpartNames.push(subpartName || '');
                    idSubparts.push(0); // will be set below
                }

                const ruleIdx = ruleNames.indexOf(ruleName);

                // Determine order value
                if (insertAtPosition !== null) {
                    // Insert at specific position — reorder all items in this rule+subpart context
                    idSubparts[ruleIdx] = insertAtPosition;
                } else {
                    // Append to end: find max id_subpart for this rule among all items
                    const maxOrder = items.reduce((max, it) => {
                        if (!Array.isArray(it.rule_name)) return max;
                        const idx = it.rule_name.indexOf(ruleName);
                        if (idx === -1) return max;
                        const order = Array.isArray(it.id_subpart) ? (it.id_subpart[idx] || 0) : 0;
                        return Math.max(max, order);
                    }, 0);
                    idSubparts[ruleIdx] = maxOrder + 1;
                }

                const updatedItem = { ...item, rule_name: ruleNames, subpart_name: subpartNames, id_subpart: idSubparts };
                saveItems(items.map(i => i.id_item === itemId ? updatedItem : i));
            };

            return (
                <div className="flex h-full overflow-hidden">

                    {/* E009: Error Toast */}
                    {errorToast && (
                        <div
                            onClick={() => setErrorToast(null)}
                            className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] cursor-pointer animate-bounce"
                            style={{ animation: 'none' }}
                        >
                            <div className="bg-red-900 border-2 border-red-500 text-red-100 px-6 py-3 rounded-xl shadow-2xl shadow-red-900/50 flex items-center gap-3 text-sm font-bold" style={{ animation: 'errorPulse 1s ease-in-out 3' }}>
                                <Icon name="alert-triangle" size={20} className="text-red-300" />
                                {errorToast}
                                <span className="text-red-400 text-xs ml-2">(click to dismiss)</span>
                            </div>
                        </div>
                    )}

                    {deleteConfirm && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4" onMouseDown={() => setDeleteConfirm(null)}>
                            <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-xl shadow-2xl shadow-black/50 overflow-hidden" onMouseDown={(e) => e.stopPropagation()}>
                                <div className="p-5 border-b border-slate-800 flex items-start gap-3">
                                    <div className="w-10 h-10 rounded-lg bg-red-950/70 border border-red-800 flex items-center justify-center shrink-0">
                                        <Icon name="trash-2" size={18} className="text-red-400" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-100">{deleteConfirm.title}</h3>
                                        <p className="text-sm text-slate-400 mt-1">{deleteConfirm.message}</p>
                                        {deleteConfirm.detail && (
                                            <p className="text-xs text-slate-500 mt-2">{deleteConfirm.detail}</p>
                                        )}
                                    </div>
                                </div>
                                <div className="p-5">
                                    <label className="flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200 cursor-pointer mb-5">
                                        <input
                                            type="checkbox"
                                            className="w-3.5 h-3.5 accent-indigo-500"
                                            checked={suppressDeleteConfirm}
                                            onChange={(e) => setSuppressDeleteConfirm(e.target.checked)}
                                        />
                                        Don't ask to confirm deletes this session
                                    </label>
                                    <div className="flex items-center justify-end gap-3">
                                        <button
                                            onClick={() => setDeleteConfirm(null)}
                                            className="px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            onClick={() => {
                                                const action = deleteConfirm.onConfirm;
                                                setDeleteConfirm(null);
                                                action();
                                            }}
                                            className="px-4 py-2 rounded-lg text-sm font-bold bg-red-700 hover:bg-red-600 text-white flex items-center gap-2 transition-colors"
                                        >
                                            <Icon name="trash-2" size={14} /> {deleteConfirm.confirmLabel}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* E016: Delete Undo Toast */}
                    {deleteToast && (
                        <div className="fixed top-4 right-6 z-[100]" style={{ animation: 'slideIn 0.3s ease-out' }}>
                            <div className="bg-slate-800 border border-slate-600 text-slate-200 px-5 py-3 rounded-xl shadow-2xl shadow-black/40 flex items-center gap-4 text-sm">
                                <div className="flex items-center gap-2">
                                    <Icon name="trash-2" size={16} className="text-red-400" />
                                    <span>{deleteToast.message}</span>
                                </div>
                                <button
                                    onClick={() => {
                                        // Restore previous state
                                        const prev = deleteToast.previousData;
                                        setDeleteToast(null);
                                        if (deleteToastTimer.current) clearTimeout(deleteToastTimer.current);
                                        if (deleteToast.restoreType === 'sources') {
                                            saveSources(prev);
                                        } else {
                                            saveItems(prev);
                                        }
                                        setStatus('Restored');
                                    }}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded font-bold text-xs flex items-center gap-1 transition-colors"
                                >
                                    <Icon name="rotate-ccw" size={12} /> Undo
                                </button>
                                <button
                                    onClick={() => setDeleteToast(null)}
                                    className="text-slate-500 hover:text-white p-1 transition-colors"
                                >
                                    <Icon name="x" size={14} />
                                </button>
                            </div>
                            {!suppressDeleteConfirm && (
                                <div className="mt-1 flex items-center justify-end gap-2 pr-1">
                                    <label className="flex items-center gap-1 text-[10px] text-slate-500 hover:text-slate-300 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            className="w-3 h-3 accent-indigo-500"
                                            onChange={(e) => { if (e.target.checked) setSuppressDeleteConfirm(true); }}
                                        />
                                        Don't ask to confirm deletes this session
                                    </label>
                                </div>
                            )}
                        </div>
                    )}

                    {/* --- SIDEBAR (RULES) --- */}
                    <div style={{ width: sidebarCollapsed ? 50 : sidebarWidth, minWidth: sidebarCollapsed ? 50 : 200, maxWidth: sidebarCollapsed ? 50 : 600, transition: 'width 0.2s ease, min-width 0.2s ease, max-width 0.2s ease' }} className="flex-none border-r border-slate-700 bg-slate-900 flex flex-col z-20 shadow-xl overflow-hidden">
                        <div className={`p-4 border-b border-slate-800 bg-slate-950 font-bold text-slate-100 flex items-center ${sidebarCollapsed ? 'justify-center' : 'justify-between'}`}>
                            {!sidebarCollapsed && (
                                <div className="flex items-center gap-2">
                                    <Icon name="book" className="text-indigo-400" />
                                    {labels.appTitle} <span className="text-slate-600 font-normal text-xs">v2.0</span>
                                </div>
                            )}
                            <div className={`flex items-center ${sidebarCollapsed ? '' : 'gap-1'}`}>
                                {!sidebarCollapsed && (
                                    <button
                                        onClick={() => setSidebarEditMode(!sidebarEditMode)}
                                        className={`px-2 py-1 rounded text-[10px] font-bold transition-colors ${sidebarEditMode ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                    >
                                        <Icon name="pencil" size={10} /> {sidebarEditMode ? 'DONE' : 'EDIT'}
                                    </button>
                                )}
                                <button
                                    onClick={() => {
                                        if (!sidebarCollapsed) {
                                            sidebarWidthBeforeCollapse.current = sidebarWidth;
                                        }
                                        setSidebarCollapsed(!sidebarCollapsed);
                                        if (sidebarCollapsed) {
                                            setSidebarWidth(sidebarWidthBeforeCollapse.current);
                                        }
                                    }}

                                            slate: isActive ? 'bg-slate-700/40 border-slate-500 text-slate-200' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500',

                                                        if (next.has(item.id_item)) next.delete(item.id_item);

                                                        <Icon name="trash-2" size={10} /> DELETE

                                                        <Icon name="search" size={8} />
                                                        matched in: {searchMatchMap.get(item.id_item)}
                                                    </div>

                                            </div>

                                    })}

                                            onClick={() => { setBulkSelectedIds(new Set()); lastBulkClickIdx.current = null; }}

                                            onClick={() => {

                                                saveItems(updated);
                                                setBulkSelectedIds(new Set());
                                                lastBulkClickIdx.current = null;

                                            onClick={() => {

                                                const updated = items.map(i => {

                                                    if (!names.includes(ruleName.trim())) {
                                                        names.push(ruleName.trim());

                                                        const subNums = [...(i.subpart_number || [])];

                                                        lastBulkClickIdx.current = null;
                                                    },

                                            <span className="text-xs text-slate-500 font-mono">

                                            <button
                                                onClick={() => hasNext && goTo(currentIdx + 1)}
                                                disabled={!hasNext}
                                                className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${hasNext ? 'text-slate-300 hover:bg-slate-800 hover:text-white' : 'text-slate-700 cursor-not-allowed'}`}

                                                        <button onClick={() => {

                                                                title: 'Delete item?',

                                                                detail: 'You can restore it immediately from the undo toast or with Ctrl+Z.',

                                                    </div>
                                                </div>

                                                {(() => {
                                                    const currentItem = items.find(i => i.id_item === selectedItemId);
                                                    const autoResize = (el) => {
                                                        if (!el) return;
                                                        el.style.height = '0';
                                                        el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.33) + 'px';
